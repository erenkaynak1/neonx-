<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NEON XI</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GC90PB01KV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-GC90PB01KV');

<style>
html,body{margin:0;min-height:100%;background:#03070a;color:#bfffd8;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.boot{font-size:12px;font-weight:700;letter-spacing:.16em;text-align:center;opacity:.78}.dot{display:inline-block;animation:p 1s ease-in-out infinite}@keyframes p{50%{opacity:.25}}
</style>
</head>
<body>
<div class="boot">NEON XI YÜKLENİYOR <span class="dot">●</span></div>
<script>
(async()=>{
  const VERSION='20260911-neon-arena-v10';
  const BOOT_GUARD='<style id="nx-home-boot-guard">html,body{background:#03070a!important}</style>';
  const REVEAL_SCRIPT='<script>(()=>{const reveal=()=>{const g=document.getElementById("nx-home-boot-guard");if(g)g.remove();};const ready=()=>!!document.querySelector("#bootHome.nx-approved-home-v1");if(ready()){requestAnimationFrame(reveal);return;}const o=new MutationObserver(()=>{if(!ready())return;o.disconnect();requestAnimationFrame(reveal);});o.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:["class"]});setTimeout(()=>{o.disconnect();reveal();},9000);})();<\/script>';
  const HOME_SOCIAL_STYLE='<style id="nx-home-social-style">body:has(#bootHome.nx-approved-home-v1.active)>.nx-social-launch{display:none!important}.nx-social-launch{z-index:399999!important}.nx-social-shade{z-index:400000!important}</style>';
  const DRAFT_SELECTION_GUARD_STYLE='<style id="nx-draft-selection-guard">#draftScreen #selectedDetail{display:none!important}html.nx-draft-selection-ready #draftScreen #selectedDetail.highlight{display:block!important}</style>';
  const replaceRequired=(source,needle,replacement,label)=>{
    const count=source.split(needle).length-1;
    if(count!==1)throw new Error(`Core patch contract failed: ${label} (${count} matches)`);
    return source.replace(needle,replacement);
  };
  try{
    const response=await fetch('./neon-xi-core.html?v='+encodeURIComponent(VERSION),{cache:'no-store'});
    if(!response.ok) throw new Error('NEON XI core '+response.status);
    let html=(await response.text()).replace(/\r\n?/g,'\n');
    const roomReserveNeedle='const roomReference = ref(database, `rooms/${roomCode}`);\n      const result = await runTransaction(';
    const roomReserveReplacement='const roomReference = ref(database, `rooms/${roomCode}`);\n      if (fixedCode) {\n        const existingPartyRoom = (await get(roomReference)).val();\n        if (existingPartyRoom?.hostUid === currentUser.uid && existingPartyRoom?.status === "waiting") return roomCode;\n      }\n      const result = await runTransaction(';
    html=replaceRequired(html,roomReserveNeedle,roomReserveReplacement,'draft room reservation');

    // A party with 3+ members uses the tournament transport, never the normal 1v1 Draft auto-room path.
    html=replaceRequired(html,'const automaticRoomLaunch = onlineLaunchParams.get("nxAuto") === "1";','const automaticRoomLaunch = onlineLaunchParams.get("nxAuto") === "1" && Number(onlineLaunchParams.get("nxPartySize") || 0) <= 2;','party auto-room guard');
    html=replaceRequired(html,'if (autoMatch.get("nxAuto") === "1") {','if (autoMatch.get("nxAuto") === "1" && Number(autoMatch.get("nxPartySize") || 0) <= 2) {','draft auto-match guard');
    // Expose the existing tournament join/watch bridge so party members can enter an already-created tournament room.
    html=replaceRequired(html,'window.NEON_XI_TOURNAMENT_ONLINE={session,leave};','window.NEON_XI_TOURNAMENT_ONLINE={session,leave,join,watch};','tournament online bridge');

    const headPos=html.search(/<\/head\s*>/i);
    if(headPos<0)throw new Error('Core document contract failed: </head> missing');
    html=html.slice(0,headPos)+BOOT_GUARD+HOME_SOCIAL_STYLE+DRAFT_SELECTION_GUARD_STYLE+html.slice(headPos);
    const injector='<link rel="stylesheet" href="./match-depth.css?v='+VERSION+'"><script src="./match-depth.js?v='+VERSION+'"><\/script>'+'<link rel="stylesheet" href="./tactical-workshop.css?v='+VERSION+'">'+
      '<script src="./tactical-load.js?v='+VERSION+'"><\/script>'+
      '<script src="./tactical-workshop.js?v='+VERSION+'"><\/script>'+
      '<script src="./side-games/neon-splash-safe-v1.js?v='+VERSION+'"><\/script>'+
      '<script src="./side-games/home-approved-v1.js?v='+VERSION+'"><\/script>'+ 
      '<link rel="stylesheet" href="./draft-mobile.css?v='+VERSION+'">'+
      '<link rel="stylesheet" href="./draft-readability-v1.css?v='+VERSION+'">'+
      '<script src="./draft-mobile-ui.js?v='+VERSION+'"><\/script>'+ 
      '<link rel="stylesheet" href="./prematch-mobile-v2.css?v='+VERSION+'">'+
      '<script src="./prematch-mobile-v2.js?v='+VERSION+'"><\/script>'+ 
      '<script src="./chem-inspector-fix.js?v='+VERSION+'"><\/script>'+ 
      '<script src="./draft-player-club-refresh-20260903.js?v='+VERSION+'"><\/script>'+ 
      '<script src="./draft-pool-scoreboard-refresh-20260904.js?v='+VERSION+'"><\/script>'+ 
      '<script src="./superlig-player-data-fm26-refresh-20260904.js?v='+VERSION+'"><\/script>'+ 
      '<script src="./public-source-ui-guard-v1.js?v='+VERSION+'"><\/script>'+ 
      '<script src="./match-2d-performance-sync-v1.js?v='+VERSION+'"><\/script>'+ 
      '<script src="./match-2d-compositor-v2.js?v='+VERSION+'"><\/script>'+ 
      '<script src="./match-2d-prebuffer-v1.js?v='+VERSION+'"><\/script>'+ 
      '<script src="./side-games/tournament-back-safe-v2.js?v='+VERSION+'"><\/script>'+ 
      '<script type="module" src="./social/party-draft-tournament-router-v1.js?v='+VERSION+'"><\/script>'+ 
      '<script type="module" src="./social/party-match-broker-v1.js?v='+VERSION+'"><\/script>'+ 
      '<script type="module" src="./social/neon-social.js?v='+VERSION+'"><\/script>'+ 
      '<script type="module" src="./social/neon-social-identity-sync-v1.js?v='+VERSION+'"><\/script>'+ 
      '<script type="module" src="./social/neon-party-membership-integrity-v2.js?v='+VERSION+'"><\/script>'+ 
      '<script type="module" src="./social/neon-social-consistency-v1.js?v='+VERSION+'"><\/script>'+ 
      '<script type="module" src="./social/party-tournament-auto-entry-v1.js?v='+VERSION+'"><\/script>'+ 
      '<script type="module" src="./social/neon-social-safe-v4.js?v='+VERSION+'"><\/script>'+ 
      '<script type="module" src="./social/neon-social-badge-click-v1.js?v='+VERSION+'"><\/script>'+ 
      '<script type="module" src="./social/neon-social-drawer-v1.js?v='+VERSION+'"><\/script>'+REVEAL_SCRIPT;
    const pos=[...html.matchAll(/<\/body\s*>/gi)].at(-1)?.index ?? -1;
    if(pos<0)throw new Error('Core document contract failed: </body> missing');
    html=html.slice(0,pos)+injector+html.slice(pos);
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.body.style.visibility='visible';
    document.body.innerHTML='<div style="padding:24px;text-align:center">NEON XI yüklenemedi.<br><small style="display:block;margin-top:8px;opacity:.7">'+String(err.message||err)+'</small><button onclick="location.reload()" style="margin-top:14px;padding:10px 16px">Tekrar dene</button></div>';
  }
})();
</script>
</body>
</html>
