<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NEON XI</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GC90PB01KV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-GC90PB01KV');

<style>
html,body{margin:0;min-height:100%;background:#03070a;color:#bfffd8;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.boot{font-size:12px;font-weight:700;letter-spacing:.16em;text-align:center;opacity:.78}.dot{display:inline-block;animation:p 1s ease-in-out infinite}@keyframes p{50%{opacity:.25}}
</style>
</head>
<body>
<div class="boot">NEON XI YÜKLENİYOR <span class="dot">●</span></div>
<script>
(async()=>{
  const VERSION='20260903-social-home-v7';
  const BOOT_GUARD='<style id="nx-home-boot-guard">html,body{background:#03070a!important}body{visibility:hidden!important}</style>';
  const REVEAL_SCRIPT='<script>(()=>{const reveal=()=>{const g=document.getElementById("nx-home-boot-guard");if(g)g.remove();};const ready=()=>!!document.querySelector(".nx-stage.nx-raster-home-v3");if(ready()){requestAnimationFrame(reveal);return;}const o=new MutationObserver(()=>{if(!ready())return;o.disconnect();requestAnimationFrame(reveal);});o.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:["class"]});setTimeout(()=>{o.disconnect();reveal();},3500);})();<\/script>';
  const SOCIAL_HOME_STYLE='<style id="nx-home-social-style">@keyframes nxHomeSocialPulse{0%,100%{filter:brightness(.88);box-shadow:0 7px 20px rgba(0,0,0,.38),0 0 7px rgba(186,255,24,.13),inset 0 0 0 rgba(186,255,24,0)}50%{filter:brightness(1.3);box-shadow:0 8px 24px rgba(0,0,0,.44),0 0 24px rgba(186,255,24,.58),inset 0 0 18px rgba(186,255,24,.12)}}#bootHome.nx-raster-home-v3 .nx-home-friends{left:6.1%!important;top:6.25%!important;width:25.5%!important;height:5.15%!important;min-height:0!important;padding:0 8px!important;border:1px solid rgba(211,255,94,.86)!important;border-radius:14px!important;background:rgba(2,13,7,.92)!important;color:#eaffac!important;font-size:clamp(9px,2.4vw,12px)!important;font-weight:900!important;letter-spacing:.14em!important;white-space:nowrap!important;display:grid!important;place-items:center!important;animation:nxHomeSocialPulse 1.35s ease-in-out infinite!important;will-change:filter,box-shadow!important;touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important}#bootHome.nx-raster-home-v3 .nx-home-friends:active{animation:none!important;background:#baff18!important;color:#071005!important;box-shadow:0 0 30px rgba(186,255,24,.75)!important}body:has(#bootHome.nx-raster-home-v3.active)>.nx-social-launch{display:none!important}@media(max-width:380px){#bootHome.nx-raster-home-v3 .nx-home-friends{left:5.8%!important;top:6.1%!important;width:26.5%!important;height:5.35%!important;font-size:9px!important}}@media(prefers-reduced-motion:reduce){#bootHome.nx-raster-home-v3 .nx-home-friends{animation:none!important;box-shadow:0 8px 24px rgba(0,0,0,.38),0 0 16px rgba(186,255,24,.3)!important}}</style>';
  const SOCIAL_HOME_SCRIPT='<script>(()=>{const SEL="#bootHome.nx-raster-home-v3 .nx-home-friends";let waitTimer=0;const paintOpen=()=>{const api=window.NEON_SOCIAL;if(!api||typeof api.open!=="function")return false;api.open("play");requestAnimationFrame(()=>{api.open("play");const s=document.querySelector(".nx-social-shade");if(s){s.classList.add("open");void s.offsetWidth;}});return true;};const openWhenReady=()=>{if(paintOpen())return;clearInterval(waitTimer);let tries=0;waitTimer=setInterval(()=>{tries++;if(paintOpen()||tries>=80)clearInterval(waitTimer);},50);};const bind=b=>{if(!b||b.dataset.nxSocialHomeBound==="7")return !!b;b.dataset.nxSocialHomeBound="7";b.textContent="SOSYAL";b.dataset.neonSocial="play";b.setAttribute("aria-label","NEON XI Sosyal ekranını aç");b.setAttribute("title","Sosyal");b.addEventListener("pointerdown",e=>{if(e.pointerType==="touch"||e.pointerType==="pen")openWhenReady();},{passive:true});b.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();openWhenReady();});return true;};const sync=()=>bind(document.querySelector(SEL));if(!sync()){const o=new MutationObserver(()=>{if(sync())o.disconnect();});o.observe(document.documentElement,{subtree:true,childList:true});setTimeout(()=>o.disconnect(),7000);}window.addEventListener("pageshow",sync,{passive:true});})();<\/script>';
  try{
    const response=await fetch('./neon-xi-core.html?v='+encodeURIComponent(VERSION),{cache:'no-store'});
    if(!response.ok) throw new Error('NEON XI core '+response.status);
    let html=await response.text();
    const headPos=html.toLowerCase().lastIndexOf('</head>');
    html=headPos>=0 ? html.slice(0,headPos)+BOOT_GUARD+SOCIAL_HOME_STYLE+html.slice(headPos) : BOOT_GUARD+SOCIAL_HOME_STYLE+html;
    const injector='<script src="./side-games/home-raster-v2.js?v='+VERSION+'"><\/script>'+
      '<link rel="stylesheet" href="./draft-mobile.css?v='+VERSION+'">'+
      '<script src="./draft-mobile-ui.js?v='+VERSION+'"><\/script>'+
      '<script src="./chem-inspector-fix.js?v='+VERSION+'"><\/script>'+
      '<script type="module" src="./social/neon-social.js?v='+VERSION+'"><\/script>'+SOCIAL_HOME_SCRIPT+REVEAL_SCRIPT;
    const pos=html.toLowerCase().lastIndexOf('</body>');
    html=pos>=0 ? html.slice(0,pos)+injector+html.slice(pos) : html+injector;
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.body.innerHTML='<div style="padding:24px;text-align:center">NEON XI yüklenemedi.<br><button onclick="location.reload()" style="margin-top:14px;padding:10px 16px">Tekrar dene</button></div>';
  }
})();
</script>
</body>
</html>
