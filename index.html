<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NEON XI</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GC90PB01KV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-GC90PB01KV');
</script>
<style>
html,body{margin:0;min-height:100%;background:#03070a;color:#bfffd8;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.boot{font-size:12px;font-weight:700;letter-spacing:.16em;text-align:center;opacity:.78}.dot{display:inline-block;animation:p 1s ease-in-out infinite}@keyframes p{50%{opacity:.25}}
</style>
</head>
<body>
<div class="boot">NEON XI YÜKLENİYOR <span class="dot">●</span></div>
<script>
(async()=>{
  const VERSION='20260903-home-social-v6';
  const BOOT_GUARD='<style id="nx-home-boot-guard">html,body{background:#03070a!important}body{visibility:hidden!important}</style>';
  const REVEAL_SCRIPT='<script>(()=>{const reveal=()=>{const g=document.getElementById("nx-home-boot-guard");if(g)g.remove();};const ready=()=>!!document.querySelector(".nx-stage.nx-raster-home-v3");if(ready()){requestAnimationFrame(reveal);return;}const o=new MutationObserver(()=>{if(!ready())return;o.disconnect();requestAnimationFrame(reveal);});o.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:["class"]});setTimeout(()=>{o.disconnect();reveal();},3500);})();<\/script>';
  const SOCIAL_HOME_STYLE='<style id="nx-home-social-style">#bootHome.nx-raster-home-v3 .nx-home-friends{left:4.2%!important;top:12.9%!important;min-height:34px!important;padding:0 12px!important;border-radius:11px!important;font-size:clamp(8px,2.1vw,10px)!important;letter-spacing:.12em!important;white-space:nowrap!important;background:rgba(3,14,8,.88)!important;box-shadow:0 7px 20px rgba(0,0,0,.34),0 0 15px rgba(179,255,52,.10)!important}body:has(#bootHome.nx-raster-home-v3.active)>.nx-social-launch{display:none!important}@media(max-width:380px){#bootHome.nx-raster-home-v3 .nx-home-friends{left:4%!important;top:12.7%!important;min-height:31px!important;padding:0 10px!important}}</style>';
  const SOCIAL_HOME_SCRIPT='<script>(()=>{const forceVisible=()=>{const s=document.querySelector(".nx-social-shade");if(!s)return;s.classList.add("open");void s.offsetHeight;requestAnimationFrame(()=>{s.style.visibility="visible";s.style.opacity="1";s.style.pointerEvents="auto";});};const openSocial=()=>{let tries=0;const run=()=>{tries++;if(window.NEON_SOCIAL&&typeof window.NEON_SOCIAL.open==="function"){window.NEON_SOCIAL.open("play");forceVisible();return;}if(tries<40)setTimeout(run,50);};run();};const sync=()=>{const b=document.querySelector("#bootHome.nx-raster-home-v3 .nx-home-friends");if(!b)return false;b.textContent="SOSYAL";b.removeAttribute("data-neon-social");b.setAttribute("aria-label","Sosyal ekranını aç — oyun içindeki Giriş tuşuyla aynı panel");b.onclick=e=>{e.preventDefault();e.stopPropagation();openSocial();};return true;};if(!sync()){const o=new MutationObserver(()=>{if(sync())o.disconnect();});o.observe(document.documentElement,{subtree:true,childList:true});setTimeout(()=>o.disconnect(),5000);}})();<\/script>';
  try{
    const response=await fetch('./neon-xi-core.html?v='+encodeURIComponent(VERSION),{cache:'no-store'});
    if(!response.ok) throw new Error('NEON XI core '+response.status);
    let html=await response.text();
    const headPos=html.toLowerCase().lastIndexOf('</head>');
    html=headPos>=0 ? html.slice(0,headPos)+BOOT_GUARD+SOCIAL_HOME_STYLE+html.slice(headPos) : BOOT_GUARD+SOCIAL_HOME_STYLE+html;
    const injector='<script src="./side-games/home-raster-v2.js?v='+VERSION+'"><\/script>'+
      '<link rel="stylesheet" href="./draft-mobile.css?v='+VERSION+'">'+
      '<script src="./draft-mobile-ui.js?v='+VERSION+'"><\/script>'+
      '<script type="module" src="./social/neon-social.js?v='+VERSION+'"><\/script>'+SOCIAL_HOME_SCRIPT+REVEAL_SCRIPT;
    const pos=html.toLowerCase().lastIndexOf('</body>');
    html=pos>=0 ? html.slice(0,pos)+injector+html.slice(pos) : html+injector;
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.body.innerHTML='<div style="padding:24px;text-align:center">NEON XI yüklenemedi.<br><button onclick="location.reload()" style="margin-top:14px;padding:10px 16px">Tekrar dene</button></div>';
  }
})();
</script>
</body>
</html>
