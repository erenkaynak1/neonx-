name: Update XOX Master Player Pool

on:
  workflow_dispatch:
  schedule:
    - cron: '40 4 * * 1'
  push:
    paths:
      - 'scripts/build_xox_master_pool.py'
      - 'side-games/data/master/xox-rules.json'
      - '.github/workflows/update-xox-master-pool.yml'

permissions:
  contents: write

concurrency:
  group: xox-master-player-pool
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data dependencies
        run: pip install --disable-pip-version-check duckdb pandas requests
      - name: Build Transfermarkt-backed XOX pool
        run: python scripts/build_xox_master_pool.py
      - name: Commit XOX pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add side-games/data/master/xox-players.json side-games/data/master/xox-meta.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh XOX master player pool"
          git push
