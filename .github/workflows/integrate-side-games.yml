name: Integrate Side Games

on:
  push:
    branches: [main]
    paths:
      - 'side-games/**'
      - 'scripts/integrate_side_games.py'
      - '.github/workflows/integrate-side-games.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assemble game and patch home menu
        run: python scripts/integrate_side_games.py

      - name: Commit generated integration
        shell: bash
        run: |
          if git diff --quiet -- index.html side-games/futbol-imposter.html; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html side-games/futbol-imposter.html
          git commit -m "Add Side Games to NEON XI home"
          git push
