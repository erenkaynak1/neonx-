name: Update Career Twin Player Pool

on:
  workflow_dispatch:
  schedule:
    - cron: '25 4 * * 1'
  push:
    paths:
      - 'scripts/build_career_twin_pool.py'
      - 'scripts/enrich_career_twin_uoc_v3.py'
      - 'scripts/enrich_career_twin_weights_v2.py'
      - 'scripts/enrich_career_twin_weights_v3.py'
      - 'scripts/enrich_career_twin_open_archive.py'
      - 'scripts/validate_career_twin_pool.py'
      - 'scripts/finalize_career_twin_runtime.py'
      - 'scripts/diagnose_career_twin_missing.py'
      - '.github/workflows/update-career-twin-pool.yml'

permissions:
  contents: write

concurrency:
  group: career-twin-player-pool
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data dependencies
        run: pip install --disable-pip-version-check duckdb pandas requests openpyxl rapidfuzz
      - name: Build recognition-first Transfermarkt candidate pool
        run: python scripts/build_career_twin_pool.py
      - name: Load 2026 UOC Transfermarkt reference values
        run: python scripts/enrich_career_twin_uoc_v3.py
      - name: Build senior club career totals from full Transfermarkt archive
        run: python scripts/enrich_career_twin_open_archive.py
      - name: Recover high-confidence physical-data matches
        run: python scripts/enrich_career_twin_weights_v2.py
      - name: Recover additional team-aware physical matches
        run: python scripts/enrich_career_twin_weights_v3.py
      - name: Apply strict multi-source quality gate
        run: python scripts/validate_career_twin_pool.py
      - name: Diagnose remaining gaps
        run: python scripts/diagnose_career_twin_missing.py
      - name: Strip unused runtime metadata
        run: python scripts/finalize_career_twin_runtime.py
      - name: Commit verified pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add side-games/career-twin/data
          git diff --cached --quiet && exit 0
          git commit -m "Refresh verified Career Twin player pool"
          git push
