name: Update Career Twin Player Pool

on:
  workflow_dispatch:
  schedule:
    - cron: '25 4 * * 1'
  push:
    paths:
      - 'scripts/build_career_twin_pool_v2.py'
      - 'scripts/enrich_career_twin_uoc_v3.py'
      - 'scripts/enrich_career_twin_open_archive.py'
      - 'scripts/enrich_career_twin_weights_v2.py'
      - 'scripts/enrich_career_twin_weights_v3.py'
      - 'scripts/enrich_career_twin_trophies_v2.py'
      - 'scripts/validate_career_twin_pool.py'
      - 'scripts/diagnose_career_twin_missing.py'
      - 'scripts/finalize_career_twin_runtime.py'
      - '.github/workflows/update-career-twin-pool.yml'

permissions:
  contents: write

concurrency:
  group: career-twin-player-pool
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data dependencies
        run: pip install --disable-pip-version-check duckdb pandas requests openpyxl rapidfuzz
      - name: Build famous-player-first Transfermarkt ID pool
        run: python scripts/build_career_twin_pool_v2.py
      - name: Load UOC Transfermarkt trophy reference
        run: python scripts/enrich_career_twin_uoc_v3.py
      - name: Build official senior club career totals
        run: python scripts/enrich_career_twin_open_archive.py
      - name: Recover exact and high-confidence weights
        run: python scripts/enrich_career_twin_weights_v2.py
      - name: Recover additional multi-key weights
        run: python scripts/enrich_career_twin_weights_v3.py
      - name: Verify missing trophies for famous players
        run: python scripts/enrich_career_twin_trophies_v2.py
      - name: Apply strict 9-of-9 quality gate
        run: python scripts/validate_career_twin_pool.py
      - name: Diagnose remaining gaps
        run: python scripts/diagnose_career_twin_missing.py
      - name: Strip unused runtime metadata
        run: python scripts/finalize_career_twin_runtime.py
      - name: Publish verified Career Twin pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f side-games/career-twin/data/pipeline-status.json side-games/career-twin/data/pipeline-career-error.log
          git add -A side-games/career-twin/data
          git diff --cached --quiet && exit 0
          git commit -m "Refresh famous-player-first Career Twin pool"
          git push
