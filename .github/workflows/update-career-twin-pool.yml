name: Update Career Twin Player Pool

on:
  workflow_dispatch:
  schedule:
    - cron: '25 4 * * 1'
  push:
    paths:
      - 'scripts/build_career_twin_pool.py'
      - '.github/workflows/update-career-twin-pool.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data dependencies
        run: pip install --disable-pip-version-check duckdb pandas requests openpyxl
      - name: Build verified player pool
        run: python scripts/build_career_twin_pool.py
      - name: Commit refreshed pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add side-games/career-twin/data
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Career Twin player pool"
          git push
