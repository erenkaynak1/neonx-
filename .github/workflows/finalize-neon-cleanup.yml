name: Finalize NEON XI update
on:
  push:
    paths:
      - '.github/workflows/finalize-neon-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Finalize Luis Diaz and validate live game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('index.html'); t=p.read_text(encoding='utf-8')
          def update_map(name,key,value):
              global t
              m=re.search(rf'const\s+{re.escape(name)}\s*=\s*(\{{.*?\}})\s*;',t,re.S)
              if not m: raise SystemExit('Map not found: '+name)
              obj=json.loads(m.group(1)); obj[key]=value
              replacement=f'const {name} = '+json.dumps(obj,ensure_ascii=False,separators=(',',':'))+';'
              t=t[:m.start()]+replacement+t[m.end():]
          update_map('NEON_XI_CURRENT_CLUB_OVERRIDES_2026','Luis Díaz',{'club':'Bayern Munich','league':'Bundesliga'})
          update_map('NEON_XI_FORMER_CLUBS_2026','Luis Díaz',['Liverpool FC','FC Porto','Junior FC','Barranquilla FC'])
          required=['if(cardRoll<.05)','else if(cardRoll<.35)','clamp(adjustment,-22,22)','(a-d)*.0088','nxSceneHost','nxEventHost','playerFormerMeta','"Luis Díaz":["Liverpool FC","FC Porto","Junior FC","Barranquilla FC"]']
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('Live validation missing: '+repr(missing))
          if 'rng() < .39' not in t and 'rng()<.39' not in t: raise SystemExit('Penalty planning signature changed unexpectedly')
          p.write_text(t,encoding='utf-8')
          print('Final validation OK; Luis Diaz manually verified.')
          PY
      - name: Remove temporary update tooling
        run: |
          git rm -f \
            scripts/neon_balance_history_update.py \
            scripts/neon_balance_history_update_v3.py \
            scripts/neon_balance_history_update_v4.py \
            scripts/neon_final_update_v5.py \
            .github/workflows/apply-neon-balance-history-v2.yml \
            .github/workflows/apply-neon-balance-history-v3.yml \
            .github/workflows/apply-neon-balance-history-v4.yml \
            .github/workflows/apply-neon-final-v5.yml \
            .github/workflows/inspect-neon-engine.yml \
            .github/workflows/inspect-neon-engine-v2.yml \
            .github/workflows/inspect-neon-tactics-v3.yml \
            .github/workflows/finalize-neon-cleanup.yml
      - name: Commit final clean state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "finalize NEON XI match balance and player history update"
          git push origin main
