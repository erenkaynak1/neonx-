name: Apply Neon XI engine visual integration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/neonxi-apply-scoreboard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply integration patch
        run: python .neonxi_tools/apply_integration_v2.py

      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes"
            exit 0
          fi
          git commit -m "Sync match engine, 2D events, stats and commentary"
          git push
