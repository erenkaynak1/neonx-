name: Runtime Integrity

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'neon-xi-core.html'
      - '*.js'
      - '*.css'
      - 'social/**'
      - 'side-games/**'
      - 'scripts/**'
      - '.github/workflows/runtime-integrity.yml'

permissions:
  contents: read

concurrency:
  group: runtime-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pool test dependencies
        run: pip install --disable-pip-version-check duckdb requests
      - name: Runtime hygiene regressions
        run: python scripts/test_runtime_hygiene.py
      - name: Canonical arcade navigation and single-menu contracts
        run: node scripts/test_arcade_navigation.cjs
      - name: First-login Firebase session and exact artwork contracts
        run: node scripts/test_neon_entry.cjs
      - name: Welcome controller JavaScript syntax
        run: node --check side-games/neon-entry-v1.js
      - name: Welcome Firebase bridge JavaScript syntax
        run: node --check side-games/neon-entry-auth-v1.js
      - name: Draft stat typography legibility contracts
        run: node scripts/test_draft_readability.cjs
      - name: Core patch contracts
        run: python scripts/test_core_patch_contracts.py
      - name: Social system regressions
        run: python scripts/test_social_system.py
      - name: Social drawer integrity
        run: python scripts/test_social_drawer_integrity.py
      - name: Social identity synchronization
        run: python scripts/test_social_identity_sync.py
      - name: Party membership integrity
        run: python scripts/test_party_membership_integrity.py
      - name: Social consistency contracts
        run: python scripts/test_social_consistency.py
      - name: Social consistency JavaScript syntax
        run: node --check social/neon-social-consistency-v1.js
      - name: Social stress lab JavaScript syntax
        run: node --check scripts/neon_social_stress_lab.mjs
      - name: Draft duplicate-player regression
        run: node scripts/test_draft_player_integrity.js
      - name: Match engine mechanics and visual-event consistency
        run: node scripts/test_engine_mechanics.cjs
      - name: Tactical workload and runtime integration
        run: node scripts/test_tactical_workshop.cjs
      - name: Contextual v6 tactical regressions
        run: node scripts/test_draft_tactical_balance.cjs
      - name: Tactical balance integration invariants
        run: node scripts/test_tactical_balance.cjs
      - name: Approved home artwork and cache preservation
        run: node scripts/test_home_hotspots.cjs
      - name: Side-game builder contracts
        run: python scripts/test_side_game_pool_builders.py
      - name: XOX data integrity regressions
        run: python scripts/test_xox_data_integrity.py
      - name: XOX data integrity JavaScript syntax
        run: node --check side-games/football-xox/xox-data-integrity-v1.js
      - name: XOX browser lab JavaScript syntax
        run: node --check scripts/xox_ui_lab.mjs
      - name: Validate committed player pools
        run: python scripts/validate_side_game_pools.py
