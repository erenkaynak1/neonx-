name: Deploy current NEON XI master

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/neonxi-deploy-current.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Rebuild and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .neonxi_deploy_20260817/patch_00.txt \
              .neonxi_deploy_20260817/patch_01.txt \
              .neonxi_deploy_20260817/patch_02.txt \
              .neonxi_deploy_20260817/patch_03.txt > /tmp/neonxi-current.patch

          echo "87165359bf340503776c0ffe550ba49c7a1fba71264289abca357ae403dbd28d  /tmp/neonxi-current.patch" | sha256sum -c -
          echo "729b333449bf4cd029ebf8c05e8e555592b84150dd9b9645c0e7358b9ff26a25  index.html" | sha256sum -c -

      - name: Apply current master changes
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward index.html < /tmp/neonxi-current.patch
          echo "23972f2ace4da7eadd14cf6de7a1d87023f9886507e3f73d31059b1fc849c11f  index.html" | sha256sum -c -
          test "$(wc -c < index.html)" = "1708799"

      - name: Clean deployment helpers
        shell: bash
        run: |
          rm -rf .neonxi_deploy_20260817
          rm -f .github/workflows/neonxi-deploy-current.yml

      - name: Commit live index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy current NEON XI master with 100x tactical simulation"
          git push
