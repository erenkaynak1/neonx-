name: FMInside diagnostic
on:
  push:
    paths: ['.github/workflows/fminside-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 243-player first-team candidate list
        shell: bash
        run: |
          python3 - <<'PY'
          import csv,gzip,io,re,requests,unicodedata,json
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          def norm(s):
            s=unicodedata.normalize('NFD',str(s or ''))
            s=''.join(c for c in s if unicodedata.category(c)!='Mn')
            return re.sub(r'[^a-z0-9]+','',s.lower())
          existing=set()
          for m in re.finditer(r'"name"\s*:\s*"([^"]+)"',html): existing.add(norm(m.group(1)))
          for m in re.finditer(r'\[\s*"[^"]+"\s*,\s*"([^"]+)"\s*,\s*"(?:GK|LB|RB|CB|DM|CM|LW|RW|ST)"\s*,\s*\d{4}',html): existing.add(norm(m.group(1)))
          print('existing regex',len(existing))
          url='https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/players.csv.gz'
          data=requests.get(url,timeout=60).content
          rows=list(csv.DictReader(io.TextIOWrapper(gzip.GzipFile(fileobj=io.BytesIO(data)),encoding='utf-8')))
          supported={'Goalkeeper','Centre-Back','Left-Back','Right-Back','Defensive Midfield','Central Midfield','Attacking Midfield','Left Winger','Right Winger','Centre-Forward','Second Striker','Left Midfield','Right Midfield'}
          elite_tokens=['Arsenal','Manchester City','Liverpool','Chelsea','Manchester United','Tottenham','Paris Saint-Germain','Real Madrid','Barcelona','Bayern','Inter','Juventus','Milan','Napoli','Atlético Madrid','Atletico Madrid','Borussia Dortmund','Bayer 04 Leverkusen','Bayer Leverkusen']
          top_comps={'GB1','ES1','IT1','L1','FR1','PO1','NL1','TR1','SA1','MLS1'}
          cand=[]
          for r in rows:
            name=r.get('name') or ''
            if not name or norm(name) in existing: continue
            pos=r.get('sub_position') or r.get('position') or ''
            if pos not in supported: continue
            club=r.get('current_club_name') or ''
            comp=r.get('current_club_domestic_competition_id') or ''
            try: mv=int(float(r.get('market_value_in_eur') or 0))
            except: mv=0
            if not club or mv<=0: continue
            elite=any(t.lower() in club.lower() for t in elite_tokens)
            if not elite and comp not in top_comps: continue
            # Alt yaş takımı / akademi isimlerini ve düşük profilli gençleri alma.
            lowclub=club.lower()
            if any(x in lowclub for x in [' u19',' u21',' u23',' youth',' juvenil',' primavera',' ii',' b team']): continue
            try:
              birth=r.get('date_of_birth') or ''
              year=int(birth[:4]) if birth[:4].isdigit() else 1998
              age=2026-year
            except: age=28
            if age < 18: continue
            if age <= 20 and mv < 8_000_000: continue
            score=mv
            if elite: score += 60_000_000
            if any(t.lower() in club.lower() for t in elite_tokens[:7]): score += 50_000_000
            cand.append((score,mv,name,pos,age,r.get('country_of_citizenship') or '',club,comp,r.get('player_id') or ''))
          cand.sort(reverse=True)
          chosen=cand[:243]
          Path('fminside-candidates.json').write_text(json.dumps([
            {'name':x[2],'sub_position':x[3],'age':x[4],'nation':x[5],'club':x[6],'competition_id':x[7],'tm_player_id':x[8],'market_value':x[1]}
            for x in chosen],ensure_ascii=False,indent=2),encoding='utf-8')
          Path('fminside-candidates.txt').write_text('\n'.join(x[2] for x in chosen),encoding='utf-8')
          print('chosen',len(chosen),'top',chosen[:5])
          PY
      - name: Commit candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fminside-candidates.json fminside-candidates.txt
          git commit -m 'temporary first-team expansion candidates' || true
          git pull --rebase origin main
          git push
