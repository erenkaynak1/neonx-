name: FMInside diagnostic
on:
  push:
    paths: ['.github/workflows/fminside-diagnostic.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect FMInside player search form
        shell: bash
        run: |
          python3 - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          u='https://fminside.net/players'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          print('status',r.status_code,'len',len(r.text),'url',r.url)
          soup=BeautifulSoup(r.text,'html.parser')
          for i,f in enumerate(soup.find_all('form')):
              print('FORM',i,'action=',f.get('action'),'method=',f.get('method'))
              for x in f.find_all(['input','select']):
                  print(' ',x.name,'name=',x.get('name'),'value=',x.get('value'),'id=',x.get('id'))
          print('links sample')
          for a in soup.find_all('a',href=True):
              h=a['href']
              if '/players/' in h:
                  print(h, a.get_text(' ',strip=True)[:80])
          PY
