name: FMInside diagnostic
on:
  push:
    paths: ['.github/workflows/fminside-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test readonly FMInside mirror
        shell: bash
        run: |
          python3 - <<'PY' > fminside-diag2.txt
          import requests
          u='https://r.jina.ai/https://fminside.net/players/7-fm-26/28122642-bukayo-saka'
          try:
            r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=20)
            print('status',r.status_code,'len',len(r.text))
            print(r.text[:20000])
          except Exception as e: print('ERR',repr(e))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fminside-diag2.txt
          git commit -m 'temporary FMInside mirror diagnostic 2' || true
          git pull --rebase origin main
          git push
