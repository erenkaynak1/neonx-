name: Import approved NEON XI home art

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-approved-home-art.yml'

permissions:
  contents: write

jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download approved artwork
        run: |
          mkdir -p side-games/assets/premium-home
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://at.adobe.com/oO86cXjUKKthEwKq' \
            -o side-games/assets/premium-home/neon-xi-approved-home-20260903.png
          test "$(wc -c < side-games/assets/premium-home/neon-xi-approved-home-20260903.png)" -gt 500000

      - name: Commit artwork and remove importer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add side-games/assets/premium-home/neon-xi-approved-home-20260903.png
          git rm .github/workflows/import-approved-home-art.yml
          git commit -m 'Add exact approved NEON XI home artwork'
          git push
