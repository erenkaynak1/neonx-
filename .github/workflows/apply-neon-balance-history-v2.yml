name: Apply NEON XI balance history v2

on:
  push:
    paths:
      - '.github/workflows/apply-neon-balance-history-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update player history, match balance and event UI
        run: python3 scripts/neon_balance_history_update.py
      - name: Commit live index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "update player history, match balance and event presentation"
          git push origin main
