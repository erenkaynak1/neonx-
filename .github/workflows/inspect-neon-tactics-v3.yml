name: Inspect NEON XI tactical phase
on:
  push:
    paths:
      - '.github/workflows/inspect-neon-tactics-v3.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print tactical formulas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          for key in ['function v3RunPhase','attackAdjustment','defenseAdjustment','probability=','probability =','function v3Config','function v3PhaseFailure','function v3DirectionRoute','function v3FinalAction']:
              print('\n===== '+key+' =====')
              start=0
              for n in range(4):
                  i=t.find(key,start)
                  if i<0: break
                  print('\n---',i,'---')
                  print(t[max(0,i-1200):min(len(t),i+2800)])
                  start=i+len(key)
          PY
