name: Export index
on:
  push:
    paths:
      - '.github/workflows/export-index.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: neon-xi-index
          path: index.html
          if-no-files-found: error
