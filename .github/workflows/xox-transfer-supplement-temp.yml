name: XOX Transfer Supplement Temp

on:
  push:
    branches:
      - xox-data-integrity-flags-20260911
    paths:
      - scripts/build_xox_transfer_supplement.py
      - .github/workflows/xox-transfer-supplement-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and audit XOX transfer supplement
        run: |
          python scripts/build_xox_transfer_supplement.py --output side-games/data/master/xox-club-supplement.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('side-games/data/master/xox-club-supplement.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          xox=json.loads(Path('side-games/data/master/xox-players.json').read_text(encoding='utf-8'))
          rules=json.loads(Path('side-games/data/master/xox-rules.json').read_text(encoding='utf-8'))
          allowed={club for clubs in rules['clubs'].values() for club in clubs}
          assert data['version']==1
          assert data['player_count'] >= 1000, data['player_count']
          assert data['matching_transfer_rows'] >= 1000, data['matching_transfer_rows']
          assert all(set(clubs) <= allowed for clubs in data['players'].values())
          by_id={str(row['id']):row for row in xox}
          enriched=added=0
          for pid,clubs in data['players'].items():
              row=by_id.get(pid)
              if not row: continue
              missing=set(clubs)-set(row.get('clubs') or [])
              if missing:
                  enriched+=1
                  added+=len(missing)
          assert enriched >= 250, enriched
          assert added >= 300, added
          expected={
              '28396':{'Fenerbahçe','Inter','Manchester City'},
              '33706':{'Fenerbahçe','Manchester United','Sporting CP'},
              '68863':{'Galatasaray','Inter','Paris Saint-Germain'},
              '861410':{'Fenerbahçe','Real Madrid'},
          }
          for pid,clubs in expected.items():
              assert clubs <= set(data['players'].get(pid,[])), (pid,data['players'].get(pid))
          print({**{k:v for k,v in data.items() if k!='players'},'enriched_existing_xox_players':enriched,'added_missing_club_links':added})
          print('CORE_HISTORY_AUDIT_START')
          for core in rules.get('audience_profile',{}).get('core_players',[]):
              pid=str(core['id'])
              row=by_id.get(pid)
              base=set((row or {}).get('clubs') or [])
              merged=sorted(base | set(data['players'].get(pid,[])))
              print(json.dumps({'id':pid,'name':core['name'],'base_clubs':sorted(base),'supplement':data['players'].get(pid,[]),'merged_clubs':merged},ensure_ascii=False))
          print('CORE_HISTORY_AUDIT_END')
          PY
      - name: Commit supplement to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add side-games/data/master/xox-club-supplement.json
          if git diff --cached --quiet; then
            echo "Supplement unchanged"
          else
            git commit -m "Generate XOX transfer-history supplement"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: xox-club-supplement
          path: side-games/data/master/xox-club-supplement.json
          if-no-files-found: error
