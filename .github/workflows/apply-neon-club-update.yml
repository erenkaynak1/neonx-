name: Apply NEON XI club update

on:
  push:
    paths:
      - 'scripts/update_club_data.py'
      - '.github/workflows/apply-neon-club-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html
        run: python3 scripts/update_club_data.py
      - name: Commit updated game
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "update NEON XI club and transfer history data"
          git push origin main
