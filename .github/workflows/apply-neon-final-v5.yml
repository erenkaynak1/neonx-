name: Apply NEON XI final v5

on:
  push:
    paths:
      - '.github/workflows/apply-neon-final-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch live game
        run: python3 scripts/neon_final_update_v5.py
      - name: Commit live index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "No live changes"; exit 0; }
          git commit -m "update club history, tactical impact and inline match events"
          git push origin main
