<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030806">
  <title>EN 11 — Neon XI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap');
    :root{--bg:#030806;--panel:#07130c;--panel2:#0a1b11;--green:#31ff76;--lime:#baff18;--lime2:#dcff72;--cyan:#3dcfff;--text:#edf8ef;--muted:#8ca996;--line:rgba(49,255,118,.23);--shadow:0 18px 50px rgba(0,0,0,.35)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,rgba(49,255,118,.11),transparent 36%),linear-gradient(180deg,#06110a,#020604 75%);color:var(--text);font-family:'Rajdhani',system-ui,sans-serif}
    body{min-height:100vh;padding:max(15px,env(safe-area-inset-top)) 14px max(22px,env(safe-area-inset-bottom));overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(49,255,118,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(49,255,118,.018) 1px,transparent 1px);background-size:40px 40px}
    button,input{font:inherit}button{color:inherit;cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}
    .app{position:relative;z-index:1;width:min(100%,760px);margin:0 auto}
    .top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}
    .back{color:#b9e7c8;text-decoration:none;font-weight:700;letter-spacing:.06em;font-size:13px}
    .brandMini{font:800 10px 'Orbitron',sans-serif;letter-spacing:.2em;color:var(--green)}
    .hero{border:1px solid rgba(49,255,118,.25);border-radius:20px;padding:17px 18px;background:linear-gradient(150deg,rgba(10,29,17,.96),rgba(4,13,8,.97));box-shadow:var(--shadow);margin-bottom:12px}
    .eyebrow{font:800 9px 'Orbitron',sans-serif;letter-spacing:.24em;color:var(--green)}
    h1{font:900 clamp(27px,8vw,38px) 'Orbitron',sans-serif;letter-spacing:.04em;margin:7px 0 4px}
    h1 span{color:var(--lime);text-shadow:0 0 20px rgba(186,255,24,.24)}
    .desc{color:var(--muted);font-size:14px;line-height:1.4}
    .panel{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(8,22,13,.96),rgba(4,12,8,.98));padding:15px;margin:10px 0;box-shadow:0 10px 30px rgba(0,0,0,.2)}
    .sectionTitle{font:800 10px 'Orbitron',sans-serif;color:var(--green);letter-spacing:.17em;margin:0 0 10px}
    .hint{font-size:12px;color:var(--muted);line-height:1.45}
    .fieldGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .fieldWrap label{display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.1em;margin:0 0 5px}
    .field{width:100%;min-height:44px;border:1px solid rgba(141,185,155,.24);border-radius:11px;background:#041009;color:var(--text);padding:9px 11px;outline:none}
    .field:focus{border-color:rgba(49,255,118,.72);box-shadow:0 0 0 3px rgba(49,255,118,.08)}
    .metricGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .metric{position:relative;text-align:left;border:1px solid rgba(141,185,155,.18);border-radius:13px;background:rgba(255,255,255,.025);padding:10px 11px;min-height:66px}
    .metric.active{border-color:rgba(186,255,24,.75);background:rgba(186,255,24,.075);box-shadow:0 0 20px rgba(186,255,24,.07) inset}
    .metric.locked{border-style:dashed;color:#728477}
    .metric strong{display:block;font-size:14px;color:var(--text);line-height:1.1}
    .metric.locked strong{color:#8d9b90}
    .metric small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.15}
    .metric .lock{position:absolute;right:9px;top:9px;color:#819287;font-size:9px;font-weight:800;letter-spacing:.1em}
    .directionRow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px}
    .directionLabel{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;margin-right:3px}
    .chip{border:1px solid rgba(141,185,155,.2);background:rgba(255,255,255,.025);border-radius:999px;padding:7px 12px;font-size:11px;font-weight:800;color:#a9bdb0}
    .chip.active{color:#07120a;background:var(--lime);border-color:transparent}
    .buttonRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .btn{min-height:46px;border:1px solid rgba(49,255,118,.3);border-radius:12px;background:rgba(49,255,118,.055);padding:10px 12px;font:800 10px 'Orbitron',sans-serif;letter-spacing:.05em}
    .btn.primary{background:var(--green);border-color:transparent;color:#041009}
    .btn.secondary{border-color:rgba(61,207,255,.3);color:#c6f4ff}
    .btn:hover:not(:disabled){filter:brightness(1.12)}
    .status{margin-top:10px;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:9px 10px;color:var(--muted);font-size:12px;line-height:1.4}
    .status.warn{border-color:rgba(220,255,114,.22);color:#c0cc9e;background:rgba(220,255,114,.035)}
    .error{color:#ff9cac}
    .foot{text-align:center;color:#587062;font-size:10px;letter-spacing:.16em;margin:18px 0 4px}
    .code{font:900 38px 'Orbitron',sans-serif;letter-spacing:.18em;color:var(--lime);margin:7px 0 11px}
    .lobbyCenter{text-align:center;padding:18px 8px}
    .lobbyNames{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:16px 0}
    .lobbyName{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(255,255,255,.025);font-size:13px;font-weight:700}
    .vs{font:800 11px 'Orbitron',sans-serif;color:var(--lime)}
    .gameTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:12px 2px}
    .gameTop h2{font:800 15px 'Orbitron',sans-serif;margin:0}
    .gameTop p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .paramBadge{border:1px solid rgba(186,255,24,.35);border-radius:999px;background:rgba(186,255,24,.06);padding:7px 10px;color:var(--lime2);font-size:10px;font-weight:800;text-align:right}
    .teamTabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}
    .teamTab{border:1px solid rgba(141,185,155,.19);border-radius:11px;background:rgba(255,255,255,.025);padding:9px 8px;color:var(--muted);font-weight:800;font-size:11px}
    .teamTab.active{border-color:rgba(186,255,24,.6);color:var(--lime2);background:rgba(186,255,24,.07)}
    .teamTab.rival.active{border-color:rgba(61,207,255,.55);color:#a6eaff;background:rgba(61,207,255,.06)}
    .scoreStrip{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:7px;margin:9px 0}

    .scoreTeam.right{text-align:right}
    .scoreTeam small{display:block;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .scoreTeam b{display:block;color:var(--lime2);font:800 14px 'Orbitron',sans-serif;margin-top:3px}
    .versus{font:800 9px 'Orbitron',sans-serif;color:#71877a}
    .turnCard{border:1px solid rgba(49,255,118,.22);border-radius:13px;padding:10px 12px;background:rgba(49,255,118,.035);margin:9px 0}
    .turnCard strong{display:block;color:var(--text);font:800 11px 'Orbitron',sans-serif}
    .turnCard span{display:block;margin-top:4px;color:var(--muted);font-size:12px}
    .pitch{position:relative;overflow:hidden;border:1px solid rgba(49,255,118,.55);border-radius:20px;min-height:560px;padding:18px 13px;background:repeating-linear-gradient(90deg,rgba(11,43,26,.78) 0 10%,rgba(6,27,17,.86) 10% 20%),linear-gradient(180deg,#092116,#06180e);box-shadow:inset 0 0 80px rgba(0,0,0,.25),0 0 23px rgba(49,255,118,.06)}
    .pitch:before{content:"";position:absolute;inset:12px;border:1px solid rgba(49,255,118,.28);pointer-events:none}
    .pitch:after{content:"";position:absolute;left:13px;right:13px;top:50%;border-top:1px solid rgba(49,255,118,.3);pointer-events:none}
    .pitchBox{position:absolute;left:27%;width:46%;height:62px;border:1px solid rgba(49,255,118,.27);pointer-events:none}
    .pitchBox.top{top:12px;border-top:0}.pitchBox.bottom{bottom:12px;border-bottom:0}
    .centerCircle{position:absolute;left:50%;top:50%;width:106px;height:106px;border:1px solid rgba(49,255,118,.28);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
    .formation{position:relative;z-index:1;min-height:522px;display:grid;grid-template-rows:1fr 1fr 1fr .8fr;gap:4px}
    .formationRow{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0}
    .roleLabel{color:#9eb7a4;font:800 9px 'Orbitron',sans-serif;letter-spacing:.18em;text-shadow:0 1px 4px #031008}
    .slots{width:100%;display:flex;justify-content:center;gap:7px}
    .slot{width:49%;max-width:285px;min-height:54px;border:1px dashed rgba(49,255,118,.52);border-radius:999px;background:rgba(2,14,8,.91);display:flex;align-items:center;justify-content:space-between;gap:5px;padding:7px 11px;box-shadow:0 4px 12px rgba(0,0,0,.24)}
    .slot.single{width:62%}
    .slot.empty{color:#7f9987}
    .slotName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:700}
    .slotValue{flex:none;border-left:1px solid rgba(61,207,255,.3);padding-left:8px;color:var(--lime2);font-size:11px;font-weight:800}
    .slot.empty .slotValue{color:#60786a}
    .pickPanel{margin-top:11px}
    .search{width:100%;min-height:45px;border:1px solid rgba(141,185,155,.24);border-radius:11px;background:#041009;color:var(--text);padding:9px 12px;outline:none}
    .results{display:grid;gap:6px;max-height:250px;overflow:auto;margin-top:8px}
    .result{width:100%;text-align:left;border:1px solid rgba(141,185,155,.13);border-radius:11px;background:rgba(255,255,255,.025);padding:9px 10px}
    .result strong{display:block;font-size:13px}
    .result small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
    .emptyResults{text-align:center;color:var(--muted);font-size:12px;padding:12px}
    .wait{text-align:center;color:#a6eaff;border:1px dashed rgba(61,207,255,.26);border-radius:12px;padding:12px;font-size:12px;margin-top:10px}
    .finalScores{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:7px;margin:17px 0}
    .finalTeam{border:1px solid rgba(141,185,155,.18);border-radius:13px;padding:13px 8px;background:rgba(255,255,255,.025)}
    .finalTeam small{display:block;color:var(--muted);font-size:10px}
    .finalTeam b{display:block;color:var(--lime2);font:800 clamp(15px,4vw,22px) 'Orbitron',sans-serif;margin-top:8px}
    .winner{color:var(--lime);font:900 20px 'Orbitron',sans-serif;margin:15px 0}
    .note{color:#9da891;font-size:11px;line-height:1.4;margin-top:8px}
    @media(min-width:700px){.metricGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.pitch{min-height:650px;padding:22px}.formation{min-height:610px}.slot{min-height:64px}.slotName,.slotValue{font-size:13px}.pitchBox{height:84px}.centerCircle{width:128px;height:128px}}
    @media(max-width:440px){body{padding-left:9px;padding-right:9px}.hero{padding:14px}.panel{padding:12px}.fieldGrid{grid-template-columns:1fr}.metric{min-height:61px}.pitch{min-height:500px;padding:12px 8px}.formation{min-height:462px}.roleLabel{font-size:8px}.slot{min-height:47px;padding:6px 8px}.slotName{font-size:10px}.slotValue{font-size:10px;padding-left:6px}.pitchBox{height:48px}.centerCircle{width:88px;height:88px}.gameTop{display:block}.paramBadge{display:inline-block;margin-top:8px}.buttonRow{grid-template-columns:1fr}}
    #app[data-team-color="0"]{--team-color:#43ff83;--team-rgb:67,255,131;--team-wash:rgba(25,255,109,.1)}
    #app[data-team-color="1"]{--team-color:#ff526f;--team-rgb:255,82,111;--team-wash:rgba(255,52,89,.11)}
    #app[data-team-color] .sectionTitle,#app[data-team-color] .turnCard strong{color:var(--team-color);text-shadow:0 0 12px rgba(var(--team-rgb),.28)}
    #app[data-team-color] .teamTab.active{border-color:rgba(var(--team-rgb),.88);color:var(--team-color);background:var(--team-wash);box-shadow:0 0 18px rgba(var(--team-rgb),.12),inset 0 0 14px rgba(var(--team-rgb),.07)}
    #app[data-team-color] .turnCard{border-color:rgba(var(--team-rgb),.48);background:var(--team-wash);box-shadow:0 0 22px rgba(var(--team-rgb),.08),inset 0 0 18px rgba(var(--team-rgb),.04)}
    #app[data-team-color] .pitch{border-color:rgba(var(--team-rgb),.9);box-shadow:inset 0 0 80px rgba(0,0,0,.18),0 0 13px rgba(var(--team-rgb),.36),0 0 34px rgba(var(--team-rgb),.17);background:repeating-linear-gradient(90deg,rgba(var(--team-rgb),.105) 0 10%,rgba(4,18,11,.89) 10% 20%),linear-gradient(180deg,#0b2516,#06160c)}
    #app[data-team-color="1"] .pitch{background:repeating-linear-gradient(90deg,rgba(255,82,111,.11) 0 10%,rgba(23,7,11,.9) 10% 20%),linear-gradient(180deg,#260c12,#10070a)}
    #app[data-team-color] .pitch:before{border-color:rgba(var(--team-rgb),.62);box-shadow:0 0 11px rgba(var(--team-rgb),.18),inset 0 0 12px rgba(var(--team-rgb),.08)}
    #app[data-team-color] .pitch:after,#app[data-team-color] .pitchBox,#app[data-team-color] .centerCircle{border-color:rgba(var(--team-rgb),.68);box-shadow:0 0 12px rgba(var(--team-rgb),.25)}
    #app[data-team-color] .pitch:after{box-shadow:0 0 10px rgba(var(--team-rgb),.38)}
    #app[data-team-color] .roleLabel{color:rgba(var(--team-rgb),.94);text-shadow:0 0 10px rgba(var(--team-rgb),.48)}
    #app[data-team-color] .slot{border-color:rgba(var(--team-rgb),.72);box-shadow:0 0 12px rgba(var(--team-rgb),.13),inset 0 0 12px rgba(var(--team-rgb),.045),0 4px 12px rgba(0,0,0,.24)}
    #app[data-team-color] .slot.empty{color:rgba(var(--team-rgb),.8)}
    #app[data-team-color] .slotValue{border-color:rgba(var(--team-rgb),.55);color:var(--team-color);text-shadow:0 0 10px rgba(var(--team-rgb),.45)}
    #app[data-team-color] .scoreTeam.selected{border-color:rgba(var(--team-rgb),.7);background:var(--team-wash);box-shadow:0 0 16px rgba(var(--team-rgb),.1)}
    #app[data-team-color] .scoreTeam.selected b{color:var(--team-color);text-shadow:0 0 12px rgba(var(--team-rgb),.4)}
    #app[data-team-color] .slotEntry{border-style:dashed;text-align:left}
    #app[data-team-color] .slotEntry:focus-within,#app[data-team-color] .slotTap:active,#app[data-team-color] .slotTap:focus-visible{border-style:solid;border-color:var(--team-color);box-shadow:0 0 22px rgba(var(--team-rgb),.3),inset 0 0 17px rgba(var(--team-rgb),.11);outline:none}
    .slotInput{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font-size:11px;font-weight:700;padding:2px 0}
    .slotInput::placeholder{color:rgba(195,225,204,.66);font-size:10px;font-weight:700;letter-spacing:.03em}
    .slotTap{font:700 10px 'Orbitron',sans-serif;letter-spacing:.04em}
    .slotTap:focus-visible{outline:2px solid var(--team-color);outline-offset:3px}
    .rollNumber.inline{display:inline-block;min-width:3ch;text-align:right;font:800 11px 'Orbitron',sans-serif;color:var(--team-color);text-shadow:0 0 12px rgba(var(--team-rgb),.7)}
    .rolling.inline{animation:inlineRoll .12s linear infinite}
    @keyframes inlineRoll{0%{transform:translateY(-2px);filter:blur(.4px);opacity:.65}50%{transform:translateY(2px);filter:blur(.8px);opacity:1}100%{transform:translateY(-2px);filter:blur(.4px);opacity:.7}}
    .resultRow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:7px}
    .resultSource{padding:7px 5px;color:var(--team-color,#a6eaff);font-size:10px;font-weight:700;text-decoration:none;white-space:nowrap}
    .resultSource:hover{text-decoration:underline}
    .finalPanel{margin-top:12px;text-align:center;border-color:rgba(var(--team-rgb),.46);box-shadow:0 0 24px rgba(var(--team-rgb),.09)}
    .finalScores{margin:12px 0}
    .finalTeam.team-a b{color:#75ff9e}.finalTeam.team-b b{color:#ff7088}
    .winner{color:var(--team-color);font:900 clamp(17px,5vw,23px) 'Orbitron',sans-serif;text-shadow:0 0 18px rgba(var(--team-rgb),.36)}
    .sourceNote{margin:0;color:#9caf9f;font-size:11px;line-height:1.4}
  </style>
</head>
<body>
  <main class="app" id="app"></main>
  <div id="overlayRoot"></div>
  <script>
  (function(){
    'use strict';
    const PREFIX='neonxi-en11-';
    const app=document.getElementById('app');
    const overlayRoot=document.getElementById('overlayRoot');
    const ROLE_LABEL={Goalkeeper:'KALECİ',Defender:'DEFANS',Midfield:'ORTA SAHA',Attack:'FORVET'};
    const ROLE_ORDER=[
      {key:'Attack',label:'FORVET',count:2},
      {key:'Midfield',label:'ORTA SAHA',count:2},
      {key:'Defender',label:'DEFANS',count:2},
      {key:'Goalkeeper',label:'KALECİ',count:1}
    ];
    const METRICS=[
      {id:'internationalGoals',label:'Millî takım golü',detail:'Üst düzey millî takım gol toplamı',mode:'sum',directions:['high'],default:'high'},
      {id:'internationalCaps',label:'Millî takım maçı',detail:'Üst düzey millî takım maç toplamı',mode:'sum',directions:['high'],default:'high'},
      {id:'careerGoals',label:'Kariyer golü',detail:'Resmî kulüp gol toplamı',mode:'sum',directions:['high'],default:'high'},
      {id:'careerAssists',label:'Kariyer asisti',detail:'Resmî kulüp asist toplamı',mode:'sum',directions:['high'],default:'high'},
      {id:'careerAppearances',label:'Kariyer maçı',detail:'Resmî kulüp maç toplamı',mode:'sum',directions:['high'],default:'high'},
      {id:'clubCount',label:'Forma giyilen kulüp',detail:'Farklı profesyonel kulüp sayısı',mode:'sum',directions:['high','low'],default:'high',isNew:true},
      {id:'heightCm',label:'Kadro boyu',detail:'Yedi oyuncunun boy ortalaması',mode:'avg',directions:['high','low'],default:'high'},
      {id:'age',label:'Kadro yaşı',detail:'Yedi oyuncunun güncel yaş ortalaması',mode:'avg',directions:['high','low'],default:'low'},
      {id:'peakValue',label:'En yüksek piyasa değeri',detail:'Oyuncuların zirve değer toplamı',mode:'sum',directions:['high'],default:'high'},
      {id:'trophies',label:'Kazanılan kupa sayısı',detail:'Doğrulanmış kupa verisi bekleniyor',mode:'sum',directions:['high'],default:'high',enabled:false,isNew:true},
      {id:'debutAge',label:'İlk A millî maç yaşı',detail:'İlk millî maç tarihi verisi bekleniyor',mode:'avg',directions:['low'],default:'low',enabled:false,isNew:true}
    ];
    const ROLE_POOL_FILE={Goalkeeper:'goalkeeper',Defender:'defender',Midfield:'midfield',Attack:'attack'};
    const S={screen:'menu',mode:'local',role:null,name:'',otherName:'',metric:'clubCount',direction:'high',poolByRole:{},poolLoads:{},poolMeta:null,peer:null,conn:null,code:'',lobby:null,game:null,viewTeam:0,error:'',searchGeneration:0,rollId:null,rollDoneId:null,lastAdvanceId:null,lastAutoTurn:null,lastAutoRevealId:null,rollTimer:null,rollInterval:null};
    const esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c==='"'?'&quot;':'&#39;'})};
    const norm=function(v){return String(v||'').toLocaleLowerCase('tr-TR').replace(/ı/g,'i').normalize('NFD').replace(/[\u0300-\u036f]/g,'')};
    const metric=function(id){return METRICS.find(function(m){return m.id===id})};
    const today=new Date();
    function ageFor(p){if(!p.birthDate)return null;const b=new Date(p.birthDate+'T00:00:00Z');if(Number.isNaN(b.getTime()))return null;let a=today.getUTCFullYear()-b.getUTCFullYear();const before=today.getUTCMonth()<b.getUTCMonth()||(today.getUTCMonth()===b.getUTCMonth()&&today.getUTCDate()<b.getUTCDate());if(before)a--;return a>=0?a:null}
    function dataCutoffLabel(){const raw=S.poolMeta&&S.poolMeta.source_cutoff;if(!raw)return 'kaynak tarihi bilinmiyor';const d=new Date(raw+'T00:00:00Z');return Number.isNaN(d.getTime())?raw:new Intl.DateTimeFormat('tr-TR',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(d)}
    function valueFor(p,id){if(id==='age')return ageFor(p);const v=p[id];return typeof v==='number'&&Number.isFinite(v)?v:null}

          box.appendChild(row);
        });
        if(!box.children.length)box.innerHTML='<div class=\"emptyResults\">Bu mevki ve parametrede eşleşme yok. Kaynakta bulunmayan oyuncuya doğrulanmış değer uydurulmaz.</div>';
      }).catch(function(){if(generation===S.searchGeneration&&box.isConnected)box.innerHTML='<div class=\"emptyResults error\">Bu mevki havuzu yüklenemedi. Bağlantını kontrol edip tekrar dene.</div>'});
    }
    function requestPick(id){
      if(!canPick())return;
      if(S.mode==='online'&&S.role==='guest'){if(S.conn&&S.conn.open)S.conn.send({type:'pick',playerId:id});return}
      commitPick(id,currentPick().team);
    }
    async function commitPick(id,expectedTeam){
      const g=S.game;const turn=currentPick();if(!g||!turn||g.phase!=='draft'||turn.team!==expectedTeam||g.used.includes(id))return;
      let pool;try{pool=await loadRolePool(turn.role)}catch(e){S.error='Oyuncu verisi yüklenemedi.';render();return}
      const now=currentPick();if(S.game!==g||!now||g.phase!=='draft'||now.team!==expectedTeam||g.used.includes(id))return;
      const p=pool.find(function(x){return Number(x.id)===Number(id)});if(!p)return;
      const value=valueFor(p,g.metric);if(value==null||p.position!==turn.role)return;
      const picked={id:p.id,name:p.name,value:value,nation:p.nation||'',sourceSlug:p.sourceSlug||''};
      g.teams[turn.team].squad[turn.role].push(picked);g.used.push(p.id);
      g.reveal={id:String(Date.now())+'-'+String(Math.random()).slice(2,7),team:turn.team,role:turn.role,player:picked,value:value};
      g.phase='reveal';S.rollId=null;S.rollDoneId=null;S.lastAutoRevealId=null;S.lastAdvanceId=null;
      if(S.mode==='online'&&S.role==='host')broadcastGame();
      render();
    }
    function renderReveal(){
      const g=S.game,r=g.reveal;if(!r)return;
      overlayRoot.innerHTML='';
      startRoll(r);
      if((S.mode==='local'||S.role==='host')&&S.lastAdvanceId!==r.id){
        S.lastAdvanceId=r.id;
        setTimeout(function(){if(!S.game||!S.game.reveal||S.game.reveal.id!==r.id)return;if(S.rollInterval)clearInterval(S.rollInterval);if(S.rollTimer)clearTimeout(S.rollTimer);S.rollInterval=null;S.rollTimer=null;S.game.turnIndex++;S.game.reveal=null;S.game.phase=S.game.turnIndex>=S.game.turns.length?'final':'draft';if(S.game.phase==='final')finishWinner();if(S.mode==='online'&&S.role==='host')broadcastGame();render()},2100);
      }
    }
    function startRoll(r){
      if(S.rollId===r.id)return;
      if(S.rollInterval)clearInterval(S.rollInterval);if(S.rollTimer)clearTimeout(S.rollTimer);
      const target=document.getElementById('rollNumber');if(!target)return;S.rollId=r.id;
      S.rollInterval=setInterval(function(){const el=document.getElementById('rollNumber');if(el)el.textContent=String(Math.floor(Math.random()*900)+100)},75);
      S.rollTimer=setTimeout(function(){if(S.rollInterval)clearInterval(S.rollInterval);S.rollInterval=null;S.rollTimer=null;S.rollDoneId=r.id;const el=document.getElementById('rollNumber');if(el){el.classList.remove('rolling');el.textContent=formatPlayerValue(r.value,S.game.metric)}},1480);
    }
    function finishWinner(){
      const g=S.game,a=teamMetric(g.teams[0]),b=teamMetric(g.teams[1]);
      if(Math.abs(a-b)<0.0001)g.winner=null;
      else if(g.direction==='high')g.winner=a>b?0:1;
      else g.winner=a<b?0:1;
    }
    function renderFinal(){
      const g=S.game,m=metric(g.metric),a=teamMetric(g.teams[0]),b=teamMetric(g.teams[1]);
      const title=g.winner==null?'BERABERE':esc(g.teams[g.winner].name)+' KAZANDI';
      overlayRoot.innerHTML='';
      app.insertAdjacentHTML('beforeend','<section class=\"panel finalPanel\"><h3 class=\"sectionTitle\">MAÇ SONUCU · '+esc(m.label)+'</h3><div class=\"finalScores\"><div class=\"finalTeam team-a\"><small>'+esc(g.teams[0].name)+'</small><b>'+esc(formatTotal(a,g.metric))+'</b></div><div class=\"versus\">VS</div><div class=\"finalTeam team-b\"><small>'+esc(g.teams[1].name)+'</small><b>'+esc(formatTotal(b,g.metric))+'</b></div></div><div class=\"winner\">'+title+'</div><div class=\"note\">'+(g.winner==null?'Aynı sonuç · rövanş zamanı.':'Yedi oyuncunun değerleri sahadaki kadro kutularında görünüyor.')+'</div><button class=\"btn primary\" id=\"rematch\" style=\"width:100%;margin-top:15px\">YENİ MAÇ</button></section>');
      const btn=document.getElementById('rematch');btn.onclick=function(){if(S.mode==='online'&&S.role==='guest'){if(S.conn&&S.conn.open)S.conn.send({type:'rematch'});S.screen='lobby';S.game=null;render();return}if(S.mode==='online'&&S.role==='host'){S.game=null;S.screen='lobby';S.lobby.guestReady=false;sendLobby();render();return}S.game=makeGame([S.name,S.otherName],S.metric,S.direction);S.viewTeam=0;S.lastAdvanceId=null;S.lastAutoTurn=null;S.lastAutoRevealId=null;S.rollId=null;S.rollDoneId=null;render()};
    }
    function render(){
      if(S.screen==='menu'){overlayRoot.innerHTML='';renderMenu();return}
      if(S.screen==='lobby'){overlayRoot.innerHTML='';renderLobby();return}
      if(S.screen==='game'){
        if(!S.game){renderMenu();return}
        if(S.game.phase==='reveal'){renderGame();renderReveal();return}
        if(S.game.phase==='final'){renderGame();renderFinal();return}
        overlayRoot.innerHTML='';renderGame();return;
      }
      renderMenu();
    }
    function init(){
      app.innerHTML=shell()+hero('Veri kaynağı hazırlanıyor…')+'<section class=\"panel\"><div class=\"status\">Oyuncu ve mevki bilgisi yükleniyor.</div></section>';
      fetch('./data/meta.json',{cache:'force-cache'}).then(function(r){if(!r.ok)throw new Error('meta');return r.json()}).then(function(meta){if(!meta||!meta.metric_coverage||!meta.player_count)throw new Error('invalid meta');S.poolMeta=meta;S.screen='menu';render()}).catch(function(){S.error='Oyuncu veri bilgisi yüklenemedi. Sayfayı yeniden açıp tekrar dene.';S.screen='menu';render()});
    }
    window.addEventListener('beforeunload',cleanup);
    init();
  })();
  </script>
</body>
