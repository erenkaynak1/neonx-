ion:absolute;right:7px;top:5px;font:900 13px 'Orbitron',sans-serif}.claimed.x .cellMark{color:var(--x)}.claimed.o .cellMark{color:var(--o)}.cellName{font-size:11px;font-weight:800;line-height:1.08}.emptyHint{color:#416157;font-size:18px}.status,.waitBox{margin-top:10px;border-radius:15px;padding:10px 12px;text-align:center;background:rgba(255,255,255,.035);color:#9bb9ae;font-size:13px}.status.good{color:#baffdc;border:1px solid rgba(73,246,177,.25)}.status.bad{color:#ff9aaf;border:1px solid rgba(255,85,119,.24)}.waitBox{border:1px dashed rgba(0,246,255,.22);color:#9cecf2}.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;padding:12px}.sheet{width:min(100%,560px);max-height:80vh;background:linear-gradient(180deg,#0a1d18,#05100e);border:1px solid rgba(73,246,177,.32);border-radius:24px 24px 18px 18px;padding:16px;overflow:auto}.sheetTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}.sheetTitle{font:900 14px 'Orbitron',sans-serif}.condition{font-size:12px;color:#8eb6a8;margin-top:4px}.close{width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:white}.results{display:grid;gap:7px;margin-top:9px;max-height:360px;overflow:auto}.result{width:100%;text-align:left;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);color:white;border-radius:13px;padding:11px 12px;font-weight:800}.result span{display:block;color:#66877b;font-size:10px;font-weight:600;margin-top:2px}.nores{color:#607d72;text-align:center;padding:16px;font-size:13px}.winTitle{font:900 23px 'Orbitron',sans-serif;margin:10px 0}@media(max-width:430px){body{padding-left:8px;padding-right:8px}.grid{grid-template-columns:68px repeat(3,1fr);grid-template-rows:60px repeat(3,96px);gap:5px}.head{font-size:9.8px;padding:4px}.cellName{font-size:10px}.hero{padding:13px}h1{font-size:24px}}
