<!DOCTYPE html>

<title>NEON XI — Football Wordle Online</title>
<style>html,body{margin:0;min-height:100%;background:#020605;color:#dfffc1;font-family:system-ui,sans-serif;display:grid;place-items:center}.load{font-size:12px;font-weight:800;letter-spacing:.12em}</style>
</head>
<body>
<div class="load">ONLINE WORDLE HAZIRLANIYOR…</div>
<script>
(async()=>{
  try{
    const res=await fetch('./index.html?v=20260903-wordle-online-v1',{cache:'no-store'});
    if(!res.ok)throw new Error('Wordle '+res.status);
    let html=await res.text();
    const seedScript=`<script>(()=>{const p=new URLSearchParams(location.search);const key=p.get('nxMatch')||p.get('nxCode')||'';if(!key)return;let h=2166136261>>>0;for(let i=0;i<key.length;i++){h^=key.charCodeAt(i);h=Math.imul(h,16777619)}let a=h>>>0;Math.random=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};document.documentElement.dataset.nxOnlineWordle='1';})();<\\/script><style>html[data-nx-online-wordle="1"] #newBtn,html[data-nx-online-wordle="1"] #againBtn{display:none!important}html[data-nx-online-wordle="1"] .meta:after{content:"ONLINE VS";display:inline-flex;align-items:center;border:1px solid rgba(22,237,255,.3);border-radius:999px;padding:5px 9px;color:#16edff;font-size:10px;font-weight:900;letter-spacing:.08em;background:rgba(22,237,255,.05)}</style>`;
    html=html.replace('</head>',seedScript+'</head>');
    document.open();document.write(html);document.close();
  }catch(err){console.error(err);document.body.innerHTML='<div style="padding:24px;text-align:center">Online Wordle yüklenemedi.<br><a href="./index.html" style="color:#a9ff2f">Geri dön</a></div>'}
})();
</script>
</body>
