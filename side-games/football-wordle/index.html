<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#160b2c">
<title>NEON XI — Football Wordle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@500;600;700&display=swap');
:root{--bg:#160b2c;--bg2:#0d1427;--panel:#101b31;--line:#42556e;--text:#fff;--muted:#91a0b7;--green:#20c96b;--yellow:#f4bf00;--dark:#34445b;--neon:#58f5b5;--cyan:#26e4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -15%,#302053 0,transparent 43%),linear-gradient(180deg,#160b2c 0%,#0c1324 66%,#07101e 100%);color:var(--text);font-family:'Rajdhani',system-ui,sans-serif}body{min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom));overflow-x:hidden}.app{width:min(100%,520px);margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.back,.new{min-height:44px;border:1px solid rgba(88,245,181,.36);border-radius:14px;background:rgba(8,20,31,.72);color:#dfffee;font:700 12px 'Rajdhani',sans-serif;letter-spacing:.08em;text-decoration:none;padding:0 14px;display:inline-flex;align-items:center;justify-content:center}.new{cursor:pointer}.brand{text-align:center;min-width:0}.eyebrow{font:700 9px 'Orbitron',sans-serif;letter-spacing:.26em;color:var(--neon)}h1{font:900 clamp(19px,6vw,28px) 'Orbitron',sans-serif;letter-spacing:.04em;margin:2px 0 0;white-space:nowrap}.meta{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:8px 0 10px}.pill{font-size:11px;font-weight:700;color:#c9d6e6;border:1px solid rgba(145,160,183,.2);background:rgba(12,22,40,.62);border-radius:999px;padding:5px 9px}.pill strong{color:var(--neon)}.boardWrap{border:1px solid rgba(99,125,155,.22);border-radius:24px;background:rgba(8,14,31,.38);padding:12px 8px 10px;box-shadow:0 24px 70px rgba(0,0,0,.27),inset 0 1px rgba(255,255,255,.025)}.board{display:grid;gap:7px;width:100%;margin:0 auto}.guessRow{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:clamp(3px,1.15vw,7px);width:100%;max-width:470px;margin:0 auto}.tile{aspect-ratio:1;border-radius:50%;border:2px solid #40536b;background:#111b30;display:grid;place-items:center;min-width:0;color:#fff;font:900 clamp(13px,5.5vw,31px) 'Rajdhani',sans-serif;text-transform:uppercase;text-shadow:0 2px 2px rgba(0,0,0,.55);transition:transform .16s ease,background .2s ease,border-color .2s ease}.board[data-long="1"] .tile{font-size:clamp(10px,3.7vw,22px)}.tile.filled{border-color:#65758d}.tile.exact{background:var(--green);border-color:var(--green)}.tile.present{background:var(--yellow);border-color:var(--yellow)}.tile.absent{background:var(--dark);border-color:var(--dark)}.tile.pop{animation:pop .13s ease}.tile.reveal{animation:flip .42s ease both}@keyframes pop{50%{transform:scale(1.08)}}@keyframes flip{0%{transform:rotateX(0)}45%{transform:rotateX(90deg)}55%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}.message{height:26px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;color:#e7edf7;font-size:13px;margin:6px 0 2px}.message.good{color:#70f4ab}.message.warn{color:#ffd75d}.keyboard{display:grid;gap:5px;margin:8px auto 0;max-width:500px;user-select:none}.keyRow{display:flex;justify-content:center;gap:4px}.key{height:44px;flex:1 1 0;max-width:43px;min-width:0;border:0;border-radius:8px;background:#4a5870;color:white;font:800 clamp(11px,3.8vw,16px) 'Rajdhani',sans-serif;cursor:pointer;box-shadow:inset 0 -2px rgba(0,0,0,.16)}.key.wide{flex:1.55;max-width:64px;font-size:11px}.key.exact{background:var(--green)}.key.present{background:var(--yellow)}.key.absent{background:#29374d}.key:active{transform:translateY(1px);filter:brightness(1.12)}.legend{display:flex;justify-content:center;gap:13px;flex-wrap:wrap;margin:12px 0 4px;color:#9caec4;font-size:11px}.legend span{display:inline-flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border-radius:50%}.dot.g{background:var(--green)}.dot.y{background:var(--yellow)}.dot.d{background:var(--dark)}.result{display:none;margin:12px 0 0;border:1px solid rgba(88,245,181,.32);border-radius:18px;background:rgba(8,23,28,.82);padding:14px;text-align:center}.result.show{display:block}.result .label{font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:700}.result .player{font:800 20px 'Orbitron',sans-serif;margin-top:5px;color:#fff}.result .answer{color:var(--neon);font-weight:800;letter-spacing:.14em;margin-top:5px}.result button{margin-top:11px;min-height:44px;border:0;border-radius:13px;background:var(--neon);color:#052018;font:800 13px 'Orbitron',sans-serif;padding:0 16px;cursor:pointer}.note{text-align:center;color:#6f8199;font-size:11px;line-height:1.35;margin:11px 8px 0}.note b{color:#aebdd0}.shake{animation:shake .25s linear}@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-3px)}}@media(max-width:370px){body{padding-inline:8px}.boardWrap{padding-inline:5px}.guessRow{gap:3px}.keyRow{gap:3px}.keyboard{gap:4px}.key{height:42px}.top{gap:5px}.back,.new{padding:0 10px;font-size:11px}}@media(prefers-reduced-motion:reduce){.tile,.key{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <a class="back" href="../index.html" aria-label="Yan oyunlara dön">← GERİ</a>
    <div class="brand"><div class="eyebrow">NEON XI · SIDE GAME</div><h1>FOOTBALL WORDLE</h1></div>
    <button class="new" id="newBtn" type="button">YENİ</button>
  </header>
  <div class="meta">
    <span class="pill">Havuz: <strong id="poolCount">—</strong></span>
    <span class="pill">Hak: <strong>6</strong></span>
    <span class="pill"><strong>SERBEST GİRİŞ</strong></span>
  </div>
  <section class="boardWrap" aria-label="Football Wordle oyun alanı">
    <div class="board" id="board"></div>
    <div class="message" id="message" role="status" aria-live="polite"></div>
  </section>
  <div class="keyboard" id="keyboard" aria-label="Harf klavyesi"></div>
  <div class="legend" aria-label="Renk açıklamaları">
    <span><i class="dot g"></i>Doğru yer</span><span><i class="dot y"></i>İsimde var</span><span><i class="dot d"></i>Yok</span>
  </div>
  <section class="result" id="result" aria-live="polite">
    <div class="label">GİZLİ FUTBOLCU</div>
    <div class="player" id="resultPlayer"></div>
    <div class="answer" id="resultAnswer"></div>
    <button id="againBtn" type="button">YENİ OYUN</button>
  </section>
  <p class="note"><b>Sözlük/isim doğrulaması yok.</b> Kutucuk sayısı kadar istediğin harfi yazıp ENTER'a basabilirsin. Önceki tüm tahminler ve renk sonuçları ekranda kalır.</p>
</main>
<script src="./players.js?v=1"></script>
<script>
(()=>{
'use strict';
const MAX_GUESSES=6;
const OVERRIDES={
  'Lionel Messi':'MESSI','Cristiano Ronaldo':'RONALDO','Kevin De Bruyne':'DEBRUYNE','Virgil van Dijk':'VANDIJK','Frenkie de Jong':'DEJONG','Donny van de Beek':'VANDEBEEK','Marc-Andre ter Stegen':'TERSTEGEN','Vinicius Junior':'VINICIUS','Ronaldo Nazario':'RONALDO','Emile Smith Rowe':'SMITHROWE','Park Ji-sung':'PARK','Van Persie':'VANPERSIE','Van Nistelrooy':'VANNISTELROOY','Van Basten':'VANBASTEN','Van der Vaart':'VANDERVAART','De Ligt':'DELIGT','De Jong':'DEJONG','De Paul':'DEPAUL','De Rossi':'DEROSSI','De Ketelaere':'DEKETELAERE','De Gea':'DEGEA','Lo Celso':'LOCELSO','El Shaarawy':'ELSHAARAWY','Abedi Pele':'ABEDI','Alisson Becker':'ALISSON','Joao Pedro':'JOAOPEDRO','Ruben Dias':'DIAS','Joško Gvardiol':'GVARDIOL','Sadio Mane':'MANE','Riyad Mahrez':'MAHREZ','Jay-Jay Okocha':'OKOCHA',"Samuel Eto'o":'ETOO','Pierre-Emerick Aubameyang':'AUBAMEYANG','Eric Maxim Choupo-Moting':'CHOUPOMOTING','DaMarcus Beasley':'BEASLEY','Rustü Recber':'RECBER','Ugürcan Cakir':'CAKIR'
};
const board=document.getElementById('board');
const keyboard=document.getElementById('keyboard');
const message=document.getElementById('message');
const result=document.getElementById('result');
const resultPlayer=document.getElementById('resultPlayer');
const resultAnswer=document.getElementById('resultAnswer');
const poolCount=document.getElementById('poolCount');
let target=null,row=0,current=[],ended=false,cells=[],keyStates=new Map();
function normalize(text){return String(text||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z]/g,'').toUpperCase()}
function answerFor(name){if(OVERRIDES[name])return OVERRIDES[name];const parts=String(name).trim().split(/\s+/);return normalize(parts[parts.length-1])}
const pool=(window.NX_WORDLE_PLAYERS||[]).map(name=>({name,answer:answerFor(name)})).filter(p=>p.answer.length>=4&&p.answer.length<=13);
poolCount.textContent=pool.length;
function randomItem(list){if(!list.length)return null;if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return list[a[0]%list.length]}return list[Math.floor(Math.random()*list.length)]}
function buildBoard(){board.replaceChildren();cells=[];board.style.setProperty('--cols',target.answer.length);board.dataset.long=target.answer.length>=9?'1':'0';for(let r=0;r<MAX_GUESSES;r++){const rowEl=document.createElement('div');rowEl.className='guessRow';rowEl.style.setProperty('--cols',target.answer.length);const rowCells=[];for(let c=0;c<target.answer.length;c++){const tile=document.createElement('div');tile.className='tile';tile.setAttribute('aria-label',`${r+1}. tahmin ${c+1}. harf`);rowEl.appendChild(tile);rowCells.push(tile)}board.appendChild(rowEl);cells.push(rowCells)}}
const keyboardLayout=[Array.from('QWERTYUIOP'),Array.from('ASDFGHJKL'),['ENTER',...Array.from('ZXCVBNM'),'⌫']];
function buildKeyboard(){keyboard.replaceChildren();for(const rowKeys of keyboardLayout){const rowEl=document.createElement('div');rowEl.className='keyRow';for(const label of rowKeys){const b=document.createElement('button');b.type='button';b.className='key'+((label==='ENTER'||label==='⌫')?' wide':'');b.textContent=label;b.dataset.key=label;b.setAttribute('aria-label',label==='⌫'?'Sil':label);b.addEventListener('click',()=>handleKey(label));rowEl.appendChild(b)}keyboard.appendChild(rowEl)}}
function showMessage(text,type=''){message.textContent=text;message.className='message'+(type?' '+type:'')}
function renderCurrent(){const rowCells=cells[row];if(!rowCells)return;for(let i=0;i<rowCells.length;i++){const value=current[i]||'';rowCells[i].textContent=value;rowCells[i].className='tile'+(value?' filled':'')}if(current.length){const t=rowCells[current.length-1];t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop')}}
function handleKey(raw){if(ended||!target)return;if(raw==='ENTER'){submit();return}if(raw==='⌫'||raw==='BACKSPACE'){if(current.length){current.pop();renderCurrent()}return}const letter=normalize(raw);if(letter.length!==1||!/[A-Z]/.test(letter))return;if(current.length<target.answer.length){current.push(letter);renderCurrent();showMessage('')}}
function evaluate(guess,answer){const out=Array(answer.length).fill('absent');const remaining=answer.split('');for(let i=0;i<answer.length;i++){if(guess[i]===answer[i]){out[i]='exact';remaining[i]=null}}for(let i=0;i<answer.length;i++){if(out[i]==='exact')continue;const idx=remaining.indexOf(guess[i]);if(idx!==-1){out[i]='present';remaining[idx]=null}}return out}
const rank={absent:1,present:2,exact:3};
function updateKey(letter,state){const old=keyStates.get(letter);if(old&&rank[old]>=rank[state])return;keyStates.set(letter,state);const key=keyboard.querySelector(`[data-key="${letter}"]`);if(key){key.classList.remove('absent','present','exact');key.classList.add(state)}}
function submit(){if(current.length!==target.answer.length){showMessage(`${target.answer.length} harf doldurmalısın`,'warn');const el=cells[row]?.[0]?.parentElement;if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}return}const guess=current.join('');const states=evaluate(guess,target.answer);states.forEach((state,i)=>{const tile=cells[row][i];tile.className=`tile ${state} reveal`;tile.style.animationDelay=`${i*55}ms`;updateKey(guess[i],state)});if(guess===target.answer){window.setTimeout(()=>finish(true),Math.min(750,target.answer.length*55+350));return}row++;current=[];if(row>=MAX_GUESSES){window.setTimeout(()=>finish(false),Math.min(750,target.answer.length*55+350))}else{showMessage(`${MAX_GUESSES-row} hak kaldı`)}}
function finish(win){ended=true;showMessage(win?'Bildin!':'Hakların bitti',win?'good':'warn');resultPlayer.textContent=target.name;resultAnswer.textContent=target.answer;result.classList.add('show');result.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'})}
function newGame(){target=randomItem(pool);if(!target){showMessage('Oyuncu havuzu yüklenemedi','warn');return}row=0;current=[];ended=false;keyStates.clear();result.classList.remove('show');showMessage(`${target.answer.length} harfli futbolcuyu bul`);buildBoard();buildKeyboard()}
document.getElementById('newBtn').addEventListener('click',newGame);document.getElementById('againBtn').addEventListener('click',newGame);
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Enter'){e.preventDefault();handleKey('ENTER');return}if(e.key==='Backspace'){e.preventDefault();handleKey('⌫');return}if(e.key.length===1){const n=normalize(e.key);if(n.length===1&&/[A-Z]/.test(n)){e.preventDefault();handleKey(n)}}});
newGame();
})();
</script>
</body>
</html>
