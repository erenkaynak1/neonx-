@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@500;600;700&display=swap');
:root{--green:#45ff9a;--cyan:#00edff;--text:#f7fff9;--muted:#83aa98;--gold:#ffd75a;--line:rgba(69,255,154,.22)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -12%,rgba(69,255,154,.12),transparent 38%),linear-gradient(180deg,#06110d,#020506 75%);color:var(--text);font-family:'Rajdhani',sans-serif}body{min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(69,255,154,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(69,255,154,.025) 1px,transparent 1px);background-size:34px 34px}.app{position:relative;z-index:1;width:min(100%,620px);margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.back{color:#baffd2;font-weight:700;font-size:12px;letter-spacing:.08em;text-decoration:none;padding:7px 2px}.pool{font-size:10px;color:var(--muted);letter-spacing:.08em}.brand{text-align:center;margin:12px 0 18px}.eyebrow{font:800 10px 'Orbitron',sans-serif;letter-spacing:.28em;color:var(--green);text-shadow:0 0 14px rgba(69,255,154,.45)}h1{font:900 clamp(29px,9vw,47px) 'Orbitron',sans-serif;line-height:.95;letter-spacing:.02em;margin:8px 0 9px}h1 span{color:var(--green);text-shadow:0 0 24px rgba(69,255,154,.35)}.subtitle{color:var(--muted);font-size:14px;line-height:1.35}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(10,24,19,.96),rgba(5,13,11,.98));padding:16px;margin:10px 0;box-shadow:0 16px 38px rgba(0,0,0,.25),inset 0 0 26px rgba(69,255,154,.025)}.label{font:800 10px 'Orbitron',sans-serif;color:var(--green);letter-spacing:.16em;margin-bottom:8px}.btn{width:100%;border:1px solid rgba(69,255,154,.5);border-radius:15px;background:rgba(69,255,154,.06);color:var(--text);min-height:50px;padding:12px 14px;font:800 13px 'Orbitron',sans-serif;letter-spacing:.06em;margin:7px 0;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#35ee89,#64ffad);color:#021208;border-color:transparent}.field{width:100%;height:49px;border:1px solid rgba(69,255,154,.24);border-radius:14px;background:#020806;color:var(--text);padding:0 13px;font:700 16px 'Rajdhani',sans-serif;outline:none;margin:5px 0 11px}.center{text-align:center}.hint{font-size:13px;color:var(--muted);line-height:1.4}.error{color:#ff7890;font-size:13px;text-align:center;min-height:20px}.spinner{width:27px;height:27px;border:3px solid rgba(69,255,154,.15);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:12px auto}@keyframes spin{to{transform:rotate(360deg)}}.code{font:900 42px 'Orbitron',sans-serif;letter-spacing:.16em;color:var(--green);text-align:center;margin:12px 0}.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:4px 0 10px}.score{border:1px solid var(--line);border-radius:14px;background:rgba(5,16,12,.9);padding:8px 10px;min-width:0}.score.right{text-align:right}.score .n{font:800 11px 'Orbitron',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score .p{font:900 23px 'Orbitron',sans-serif;color:var(--green)}.roundBadge{font:800 9px 'Orbitron',sans-serif;color:var(--muted);letter-spacing:.12em;text-align:center}.metricTitle{text-align:center;margin:14px 0 8px}.metricTitle b{display:block;font:900 24px 'Orbitron',sans-serif}.metricTitle span{font-size:11px;color:var(--green);letter-spacing:.16em}.progress{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:12px 0}.pip{height:4px;border-radius:9px;background:rgba(255,255,255,.08)}.pip.done{background:var(--green)}.pip.now{background:var(--cyan)}.arena{display:grid;grid-template-columns:1fr .92fr 1fr;gap:7px;margin:10px 0}.slot{border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(5,13,11,.94);padding:10px 7px;text-align:center;min-height:104px;display:flex;flex-direction:column;justify-content:center}.slot.target{border-color:rgba(0,237,255,.42)}.slot.win{border-color:var(--green);box-shadow:0 0 18px rgba(69,255,154,.22)}.slot.draw{border-color:var(--gold)}.slot .who{font:800 8px 'Orbitron',sans-serif;color:var(--muted);letter-spacing:.1em;margin-bottom:8px}.slot .name{font:800 13px 'Rajdhani',sans-serif;line-height:1.05}.slot .val{font:900 15px 'Orbitron',sans-serif;color:var(--green);margin-top:7px}.lock{font:800 10px 'Orbitron',sans-serif;color:var(--green);margin-top:7px}.searchHead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px}.searchHead b{font:800 11px 'Orbitron',sans-serif}.searchHead span{font-size:11px;color:var(--muted)}.results{display:grid;gap:7px;max-height:294px;overflow:auto}.playerBtn{width:100%;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:rgba(255,255,255,.025);color:var(--text);padding:10px 11px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}.playerBtn b{font-size:14px}.playerBtn small{display:block;color:var(--muted);font-size:10px}.arrow{color:var(--green);font-size:18px}.statusBox{text-align:center;padding:15px;border:1px dashed rgba(69,255,154,.2);border-radius:15px;color:var(--muted);font-size:13px;margin-top:10px}.revealTitle{text-align:center;font:900 12px 'Orbitron',sans-serif;color:var(--green);letter-spacing:.12em;margin:10px 0}.winnerText{text-align:center;font:900 17px 'Orbitron',sans-serif;margin:10px 0}.winnerText.draw{color:var(--gold)}.finalScore{font:900 52px 'Orbitron',sans-serif;color:var(--green);text-align:center;margin:8px 0}.finalTitle{text-align:center;font:900 26px 'Orbitron',sans-serif;line-height:1.05;margin:12px 0}@media(max-width:390px){body{padding-left:8px;padding-right:8px}.card{padding:13px}.arena{gap:5px}.slot{padding:8px 4px}}
