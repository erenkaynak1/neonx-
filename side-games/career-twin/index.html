<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON XI — Kariyer İkizi</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@500;600;700&display=swap');
:root{--bg:#020607;--panel:#07110e;--panel2:#0a1713;--green:#45ff9a;--cyan:#00edff;--text:#f7fff9;--muted:#83aa98;--red:#ff4664;--gold:#ffd75a;--line:rgba(69,255,154,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -12%,rgba(69,255,154,.12),transparent 38%),linear-gradient(180deg,#06110d,#020506 75%);color:var(--text);font-family:'Rajdhani',sans-serif}body{min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(69,255,154,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(69,255,154,.025) 1px,transparent 1px);background-size:34px 34px}.app{position:relative;z-index:1;width:min(100%,620px);margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.back,.mini{appearance:none;border:0;background:transparent;color:#baffd2;font:700 12px 'Rajdhani',sans-serif;letter-spacing:.08em;text-decoration:none;padding:7px 2px}.pool{font-size:10px;color:var(--muted);letter-spacing:.08em}.brand{text-align:center;margin:12px 0 18px}.eyebrow{font:800 10px 'Orbitron',sans-serif;letter-spacing:.28em;color:var(--green);text-shadow:0 0 14px rgba(69,255,154,.45)}h1{font:900 clamp(29px,9vw,47px) 'Orbitron',sans-serif;line-height:.95;letter-spacing:.02em;margin:8px 0 9px}h1 span{color:var(--green);text-shadow:0 0 24px rgba(69,255,154,.35)}.subtitle{color:var(--muted);font-size:14px;line-height:1.35}.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(10,24,19,.96),rgba(5,13,11,.98));padding:16px;margin:10px 0;box-shadow:0 16px 38px rgba(0,0,0,.25),inset 0 0 26px rgba(69,255,154,.025)}.label{font:800 10px 'Orbitron',sans-serif;color:var(--green);letter-spacing:.16em;margin-bottom:8px}.btn{width:100%;border:1px solid rgba(69,255,154,.5);border-radius:15px;background:rgba(69,255,154,.06);color:var(--text);min-height:50px;padding:12px 14px;font:800 13px 'Orbitron',sans-serif;letter-spacing:.06em;margin:7px 0;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#35ee89,#64ffad);color:#021208;border-color:transparent;box-shadow:0 0 24px rgba(69,255,154,.16)}.btn:disabled{opacity:.35;cursor:default}.btn.small{min-height:42px;font-size:11px}.field{width:100%;height:49px;border:1px solid rgba(69,255,154,.24);border-radius:14px;background:#020806;color:var(--text);padding:0 13px;font:700 16px 'Rajdhani',sans-serif;outline:none;margin:5px 0 11px}.field:focus{border-color:rgba(69,255,154,.65);box-shadow:0 0 0 3px rgba(69,255,154,.06)}.code{font:900 42px 'Orbitron',sans-serif;letter-spacing:.16em;color:var(--green);text-align:center;text-shadow:0 0 25px rgba(69,255,154,.4);margin:12px 0}.center{text-align:center}.hint{font-size:13px;color:var(--muted);line-height:1.4}.error{color:#ff7890;font-size:13px;text-align:center;min-height:20px}.spinner{width:27px;height:27px;border:3px solid rgba(69,255,154,.15);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:12px auto}@keyframes spin{to{transform:rotate(360deg)}}
.scorebar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:4px 0 10px}.score{border:1px solid var(--line);border-radius:14px;background:rgba(5,16,12,.9);padding:8px 10px;min-width:0}.score.right{text-align:right}.score .n{font:800 11px 'Orbitron',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score .p{font:900 23px 'Orbitron',sans-serif;color:var(--green)}.roundBadge{font:800 9px 'Orbitron',sans-serif;color:var(--muted);letter-spacing:.12em;text-align:center;white-space:nowrap}.metricTitle{text-align:center;margin:14px 0 8px}.metricTitle b{display:block;font:900 24px 'Orbitron',sans-serif;color:var(--text)}.metricTitle span{font-size:11px;color:var(--green);letter-spacing:.16em}.arena{display:grid;grid-template-columns:1fr .92fr 1fr;gap:7px;align-items:stretch;margin:10px 0}.slot{min-width:0;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(5,13,11,.94);padding:10px 7px;text-align:center;display:flex;flex-direction:column;justify-content:center;min-height:104px;position:relative}.slot.target{border-color:rgba(0,237,255,.42);box-shadow:inset 0 0 23px rgba(0,237,255,.04)}.slot.win{border-color:var(--green);box-shadow:0 0 18px rgba(69,255,154,.22),inset 0 0 18px rgba(69,255,154,.05)}.slot.draw{border-color:var(--gold)}.slot .who{font:800 8px 'Orbitron',sans-serif;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}.slot.target .who{color:var(--cyan)}.slot .name{font:800 13px 'Rajdhani',sans-serif;line-height:1.05;word-break:break-word}.slot.target .name{font-size:14px;color:#eaffff}.slot .val{font:900 15px 'Orbitron',sans-serif;color:var(--green);margin-top:7px}.slot.target .val{color:var(--cyan)}.slot .delta{font-size:10px;color:var(--muted);margin-top:4px}.lock{font:800 10px 'Orbitron',sans-serif;color:var(--green);margin-top:7px}.secret{filter:blur(4px);opacity:.55}.searchBox{margin-top:10px}.searchHead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px}.searchHead b{font:800 11px 'Orbitron',sans-serif}.searchHead span{font-size:11px;color:var(--muted)}.results{display:grid;gap:7px;max-height:294px;overflow:auto;padding-right:2px}.playerBtn{width:100%;border:1px solid rgba(255,255,255,.08);border-radius:13px;background:rgba(255,255,255,.025);color:var(--text);padding:10px 11px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}.playerBtn:active{border-color:var(--green);transform:scale(.99)}.playerBtn b{font-size:14px;line-height:1.05}.playerBtn small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.arrow{color:var(--green);font-size:18px}.statusBox{text-align:center;padding:15px;border:1px dashed rgba(69,255,154,.2);border-radius:15px;color:var(--muted);font-size:13px;margin-top:10px}.revealTitle{text-align:center;font:900 12px 'Orbitron',sans-serif;color:var(--green);letter-spacing:.12em;margin:10px 0}.winnerText{text-align:center;font:900 17px 'Orbitron',sans-serif;margin:10px 0}.winnerText.draw{color:var(--gold)}.progress{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:12px 0}.pip{height:4px;border-radius:9px;background:rgba(255,255,255,.08)}.pip.done{background:var(--green);box-shadow:0 0 8px rgba(69,255,154,.25)}.pip.now{background:var(--cyan)}.finalScore{font:900 52px 'Orbitron',sans-serif;color:var(--green);text-align:center;margin:8px 0}.finalTitle{text-align:center;font:900 26px 'Orbitron',sans-serif;line-height:1.05;margin:12px 0}.targetSummary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:9px 5px;text-align:center}.stat b{display:block;font:800 10px 'Orbitron',sans-serif;color:var(--green);margin-bottom:4px}.stat span{font-size:11px;color:#d8eee3}.notice{font-size:11px;color:#668477;text-align:center;margin-top:12px}.hidden{display:none!important}
@media(max-width:390px){body{padding-left:8px;padding-right:8px}.card{padding:13px}.arena{gap:5px}.slot{padding:8px 4px}.slot .name{font-size:12px}.slot .val{font-size:12px}.targetSummary{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
'use strict';
const PREFIX='neonxi-career-twin-';
const METRICS=[
  {key:'height_cm',label:'BOY'},
  {key:'weight_kg',label:'KİLO'},
  {key:'birth_date',label:'DOĞUM TARİHİ'},
  {key:'club_count',label:'KULÜP SAYISI'},
  {key:'trophies',label:'KUPA SAYISI'},
  {key:'career_goals',label:'KARİYER GOLÜ'},
  {key:'career_assists',label:'KARİYER ASİSTİ'},
  {key:'peak_market_value_eur',label:'EN YÜKSEK PİYASA DEĞERİ'},
  {key:'career_appearances',label:'KARİYER MAÇI'}
];
let PLAYERS=[],BY_ID=new Map(),peer=null,conn=null,guestConn=null,hostGame=null,remoteState=null,revealTimer=null;
const S={screen:'boot',role:null,myName:'',code:'',error:'',connected:false,search:'',pending:false};
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
function clear(){app.innerHTML=''}
function top(back=true){const t=el('div','topbar');if(back){const a=el('a','back','← YAN OYUNLAR');a.href='../index.html';t.appendChild(a)}else t.appendChild(el('span'));
 t.appendChild(el('div','pool',PLAYERS.length?PLAYERS.length+' DOĞRULANMIŞ OYUNCU':''));app.appendChild(t)}
function brand(sub='Kariyerini hedef futbolcuya en çok yaklaştır'){const b=el('div','brand');b.innerHTML='<div class="eyebrow">NEON XI · SIDE GAME</div><h1>KARİYER <span>İKİZİ</span></h1><div class="subtitle">'+esc(sub)+'</div>';app.appendChild(b)}
function button(text,primary,fn){const b=el('button','btn'+(primary?' primary':''),esc(text));b.onclick=fn;return b}
function field(label,placeholder,value,oninput,max){const w=el('div');w.appendChild(el('div','label',esc(label)));const i=el('input','field');i.placeholder=placeholder;i.value=value||'';if(max)i.maxLength=max;i.oninput=e=>oninput(e.target.value,e.target);w.appendChild(i);return {wrap:w,input:i}}
function render(){clear();if(S.screen==='boot')return renderBoot();if(S.screen==='menu')return renderMenu();if(S.screen==='create')return renderCreate();if(S.screen==='join')return renderJoin();if(S.screen==='lobby')return renderLobby();if(S.screen==='game')return renderGame();}
function renderBoot(){top();brand('Oyuncu havuzu yükleniyor…');const c=el('div','card center');c.appendChild(el('div','spinner'));c.appendChild(el('div','hint','9/9 eksiksiz oyuncular hazırlanıyor.'));app.appendChild(c)}
function renderMenu(){top();brand();const c=el('div','card');c.appendChild(el('div','label','2 OYUNCULU ONLINE OYUN'));c.appendChild(button('ODA KUR',true,()=>{S.error='';S.screen='create';render()}));c.appendChild(button('KODLA KATIL',false,()=>{S.error='';S.screen='join';render()}));app.appendChild(c);const info=el('div','card');info.innerHTML='<div class="label">NASIL OYNANIR?</div><div class="hint">Ortadaki hedef futbolcu 9 tur boyunca aynı kalır. Her tur farklı bir kariyer parametresi açılır. İki oyuncu da başka bir futbolcu seçer; hedef değere en yakın seçim turu kazanır. Seçim dokunduğun anda kilitlenir ve iki taraf da seçene kadar rakibe görünmez.</div>';app.appendChild(info);app.appendChild(el('div','notice','Süre yok · Aynı oyuncuyu kendi seçimlerinde tekrar kullanamazsın'))}
function renderCreate(){top();brand('4 haneli oda kodu oluştur');const c=el('div','card');const f=field('ADIN','Örn. Eren',S.myName,v=>S.myName=v);c.appendChild(f.wrap);c.appendChild(button('ODAYI KUR',true,()=>createRoom(f.input.value.trim())));c.appendChild(el('div','error',esc(S.error)));app.appendChild(c)}
function renderJoin(){top();brand('Arkadaşının oda kodunu gir');const c=el('div','card');const cf=field('ODA KODU','1234',S.code,v=>{S.code=v.replace(/\D/g,'').slice(0,4)},4);cf.input.inputMode='numeric';cf.input.oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);S.code=e.target.value};const nf=field('ADIN','Örn. Gamze',S.myName,v=>S.myName=v);c.appendChild(cf.wrap);c.appendChild(nf.wrap);c.appendChild(button('KATIL',true,()=>joinRoom(cf.input.value.trim(),nf.input.value.trim())));c.appendChild(el('div','error',esc(S.error)));app.appendChild(c)}
function renderLobby(){top();brand(S.role==='host'?'Oda hazır · ikinci oyuncu bekleniyor':'Odaya bağlanılıyor…');const c=el('div','card center');c.appendChild(el('div','label','ODA KODU'));c.appendChild(el('div','code',esc(S.code)));c.appendChild(el('div','spinner'));c.appendChild(el('div','hint',S.role==='host'?'Kodu arkadaşınla paylaş. İkinci oyuncu bağlandığı anda oyun otomatik başlayacak.':'Oda sahibine bağlanılıyor…'));app.appendChild(c);if(S.error)app.appendChild(el('div','error',esc(S.error)))}
async function loadPeer(){if(window.Peer)return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('PeerJS yüklenemedi'));document.head.appendChild(s)})}
function cleanupPeer(){clearTimeout(revealTimer);try{conn&&conn.close()}catch(e){}try{guestConn&&guestConn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}peer=conn=guestConn=null;hostGame=remoteState=null;S.connected=false;S.pending=false}
function roomCode(){return String(Math.floor(1000+Math.random()*9000))}
async function createRoom(name){if(!name){S.error='Önce adını yaz.';render();return}cleanupPeer();S.myName=name;S.role='host';S.error='';S.screen='lobby';render();try{await loadPeer();await tryHost(0)}catch(e){S.error='Bağlantı kurulamadı. Tekrar dene.';render()}}
function tryHost(attempt){return new Promise((resolve,reject)=>{if(attempt>=8)return reject(new Error('code'));const code=roomCode();S.code=code;const p=new Peer(PREFIX+code,{debug:0});peer=p;let settled=false;p.on('open',()=>{settled=true;bindHostPeer(p);render();resolve()});p.on('error',err=>{if(!settled&&(err.type==='unavailable-id'||err.type==='invalid-id')){try{p.destroy()}catch(e){}tryHost(attempt+1).then(resolve,reject)}else if(!settled)reject(err)})})}
function bindHostPeer(p){p.on('connection',c=>{if(guestConn&&guestConn.open){c.on('open',()=>c.send({type:'reject',message:'Oda dolu.'}));return}guestConn=c;bindHostConnection(c)});p.on('error',()=>{})}
function bindHostConnection(c){let joined=false;c.on('data',m=>{if(!m||typeof m!=='object')return;if(m.type==='join'&&!joined){const name=String(m.name||'').trim().slice(0,24);if(!name){c.send({type:'reject',message:'Geçersiz isim.'});return}joined=true;S.connected=true;c.send({type:'accepted',code:S.code,role:'guest',hostName:S.myName,guestName:name});startNewGame(name);return}if(!joined||!hostGame)return;if(m.type==='select')hostSelect('guest',Number(m.playerId),Number(m.round));if(m.type==='rematch'&&hostGame.phase==='final')startNewGame(hostGame.players.guest)});c.on('close',()=>{if(joined){S.error='Diğer oyuncunun bağlantısı koptu.';S.screen='lobby';S.connected=false;hostGame=null;render()}});c.on('error',()=>{})}
async function joinRoom(code,name){if(!/^\d{4}$/.test(code)){S.error='4 haneli oda kodu gir.';render();return}if(!name){S.error='Önce adını yaz.';render();return}cleanupPeer();S.code=code;S.myName=name;S.role='guest';S.error='';S.screen='lobby';render();try{await loadPeer();peer=new Peer(undefined,{debug:0});let opened=false;peer.on('open',()=>{opened=true;conn=peer.connect(PREFIX+code,{reliable:true});bindGuestConnection(conn,name)});peer.on('error',()=>{if(!opened){S.error='Bağlantı kurulamadı.';render()}});setTimeout(()=>{if(S.screen==='lobby'&&!S.connected){S.error='Oda bulunamadı veya bağlantı kurulamadı.';render()}},8000)}catch(e){S.error='Bağlantı servisi yüklenemedi.';render()}}
function bindGuestConnection(c,name){c.on('open',()=>c.send({type:'join',name}));c.on('data',m=>{if(!m||typeof m!=='object')return;if(m.type==='reject'){S.error=m.message||'Odaya katılamadın.';render();return}if(m.type==='accepted'){S.connected=true;return}if(m.type==='state'){remoteState=m;S.screen='game';S.pending=false;render()}});c.on('close',()=>{S.error='Oda sahibi bağlantıyı kapattı.';S.screen='lobby';S.connected=false;render()});c.on('error',()=>{})}
function chooseTarget(){const active=PLAYERS.filter(p=>p.status==='active');const source=(active.length>120&&Math.random()<.85?active:PLAYERS).slice().sort((a,b)=>(b.recognition_score||0)-(a.recognition_score||0));const cap=source.slice(0,Math.min(source.length,500));const weights=cap.map((p,i)=>Math.max(1,Math.sqrt(Math.max(1,p.recognition_score||1))*(1-i/(cap.length*1.35))));let r=Math.random()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<cap.length;i++){r-=weights[i];if(r<=0)return cap[i]}return cap[0]}
function startNewGame(guestName){clearTimeout(revealTimer);const target=chooseTarget();hostGame={players:{host:S.myName,guest:guestName},phase:'pick',round:0,targetId:target.id,scores:{host:0,guest:0},picks:{host:null,guest:null},used:{host:[],guest:[]},roundResult:null,revision:1};S.screen='game';S.search='';S.pending=false;broadcastState();render()}
function snapshotFor(role){const g=hostGame,opp=role==='host'?'guest':'host',reveal=g.phase==='reveal'||g.phase==='final';return {type:'state',code:S.code,role,players:g.players,phase:g.phase,round:g.round,targetId:g.targetId,scores:g.scores,ownPick:g.picks[role],oppPicked:!!g.picks[opp],picks:reveal?g.picks:null,used:g.used[role],roundResult:reveal?g.roundResult:null,revision:g.revision}}
function broadcastState(){if(!hostGame)return;if(guestConn&&guestConn.open)guestConn.send(snapshotFor('guest'))}
function currentView(){return S.role==='host'&&hostGame?snapshotFor('host'):remoteState}
function metricValue(p,key){if(!p)return NaN;if(key==='birth_date'){const d=Date.parse(p[key]);return Number.isFinite(d)?d/86400000:NaN}return Number(p[key])}
function formatValue(v,key){if(key==='birth_date'){const d=new Date(v);if(Number.isNaN(d.getTime()))return '—';return String(d.getUTCDate()).padStart(2,'0')+'.'+String(d.getUTCMonth()+1).padStart(2,'0')+'.'+d.getUTCFullYear()}if(key==='height_cm')return v+' cm';if(key==='weight_kg')return v+' kg';if(key==='club_count')return v+' kulüp';if(key==='trophies')return v+' kupa';if(key==='career_goals')return v+' gol';if(key==='career_assists')return v+' asist';if(key==='career_appearances')return v+' maç';if(key==='peak_market_value_eur'){if(v>=1000000)return '€'+(v/1000000).toLocaleString('tr-TR',{maximumFractionDigits:1})+' M';if(v>=1000)return '€'+(v/1000).toLocaleString('tr-TR',{maximumFractionDigits:0})+' B';return '€'+v.toLocaleString('tr-TR')}return String(v)}
function diffLabel(d,key){if(key==='birth_date'){const years=d/365.2425;return 'fark '+years.toLocaleString('tr-TR',{maximumFractionDigits:1})+' yıl'}return 'fark '+formatValue(d,key)}
function hostSelect(role,id,round){const g=hostGame;if(!g||g.phase!=='pick'||round!==g.round||g.picks[role])return;const p=BY_ID.get(id);if(!p||id===g.targetId||g.used[role].includes(id))return;g.picks[role]=id;g.revision++;if(g.picks.host&&g.picks.guest)resolveRound();broadcastState();render()}
function resolveRound(){const g=hostGame,m=METRICS[g.round],target=BY_ID.get(g.targetId),a=BY_ID.get(g.picks.host),b=BY_ID.get(g.picks.guest);const tv=metricValue(target,m.key),av=metricValue(a,m.key),bv=metricValue(b,m.key);const da=Math.abs(av-tv),db=Math.abs(bv-tv);let winner='draw';if(da<db)winner='host';else if(db<da)winner='guest';if(winner!=='draw')g.scores[winner]++;g.used.host.push(g.picks.host);g.used.guest.push(g.picks.guest);g.roundResult={winner,targetValue:target[m.key],hostValue:a[m.key],guestValue:b[m.key],hostDiff:da,guestDiff:db};g.phase='reveal';g.revision++;const rev=g.revision;clearTimeout(revealTimer);revealTimer=setTimeout(()=>{if(!hostGame||hostGame.revision!==rev||hostGame.phase!=='reveal')return;if(hostGame.round>=METRICS.length-1){hostGame.phase='final';hostGame.revision++;broadcastState();render()}else{hostGame.round++;hostGame.phase='pick';hostGame.picks={host:null,guest:null};hostGame.roundResult=null;hostGame.revision++;S.search='';broadcastState();render()}},4700)}
function submitSelection(id){const v=currentView();if(!v||v.phase!=='pick'||v.ownPick||S.pending)return;if(S.role==='host'){hostSelect('host',id,v.round)}else if(conn&&conn.open){S.pending=true;conn.send({type:'select',playerId:id,round:v.round});render()}}
function renderGame(){top();const v=currentView();if(!v){brand('Oyun durumu bekleniyor…');const c=el('div','card center');c.appendChild(el('div','spinner'));app.appendChild(c);return}if(v.phase==='final')return renderFinal(v);brand('Hedef futbolcunun kariyerine en çok yaklaş');const m=METRICS[v.round],target=BY_ID.get(v.targetId);const sb=el('div','scorebar');sb.innerHTML='<div class="score"><div class="n">'+esc(v.players.host)+'</div><div class="p">'+v.scores.host+'</div></div><div class="roundBadge">'+(v.round+1)+' / 9</div><div class="score right"><div class="n">'+esc(v.players.guest)+'</div><div class="p">'+v.scores.guest+'</div></div>';app.appendChild(sb);const mt=el('div','metricTitle');mt.innerHTML='<span>ŞİMDİKİ PARAMETRE</span><b>'+esc(m.label)+'</b>';app.appendChild(mt);renderProgress(v);renderArena(v,target,m);if(v.phase==='pick')renderPicker(v,target,m);else renderReveal(v,target,m)}
function renderProgress(v){const p=el('div','progress');for(let i=0;i<9;i++){const x=el('div','pip'+(i<v.round?' done':i===v.round?' now':''));p.appendChild(x)}app.appendChild(p)}
function displayPick(v,role){if(v.phase==='reveal'||v.phase==='final')return v.picks&&BY_ID.get(v.picks[role]);if(role===v.role&&v.ownPick)return BY_ID.get(v.ownPick);return null}
function renderArena(v,target,m){const a=el('div','arena');['host','target','guest'].forEach(role=>{const s=el('div','slot'+(role==='target'?' target':''));const isTarget=role==='target';const label=isTarget?'HEDEF':role==='host'?v.players.host:v.players.guest;s.appendChild(el('div','who',esc(label)));if(isTarget){s.appendChild(el('div','name',esc(target.name)));if(v.phase==='reveal')s.appendChild(el('div','val',esc(formatValue(target[m.key],m.key))))}else{const p=displayPick(v,role);if(p){s.appendChild(el('div','name',esc(p.name)));if(v.phase==='reveal'){const rr=v.roundResult,val=role==='host'?rr.hostValue:rr.guestValue,d=role==='host'?rr.hostDiff:rr.guestDiff;s.appendChild(el('div','val',esc(formatValue(val,m.key))));s.appendChild(el('div','delta',esc(diffLabel(d,m.key))));if(rr.winner===role)s.classList.add('win');else if(rr.winner==='draw')s.classList.add('draw')}else s.appendChild(el('div','lock','KİLİTLENDİ'))}else{const isOwn=role===v.role;const picked=isOwn?!!v.ownPick:!!v.oppPicked;s.appendChild(el('div','name',picked?'SEÇİM YAPILDI':'BEKLİYOR'));if(picked&&!isOwn)s.classList.add('secret')}}a.appendChild(s)});app.appendChild(a)}
function normalize(s){return String(s||'').toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function renderPicker(v,target,m){const own=v.role,ownName=v.players[own];if(v.ownPick||S.pending){const st=el('div','statusBox',S.pending?'Seçimin kilitleniyor…':'<b>'+esc(ownName)+'</b> seçimini yaptı.<br>Rakibin seçimi bekleniyor.');app.appendChild(st);return}const c=el('div','card searchBox');const head=el('div','searchHead');head.innerHTML='<b>FUTBOLCUNU SEÇ</b><span>dokununca kilitlenir</span>';c.appendChild(head);const inp=el('input','field');inp.placeholder='Oyuncu ara…';inp.value=S.search;inp.autocomplete='off';inp.oninput=e=>{S.search=e.target.value;fillResults(results,v,target)};c.appendChild(inp);const results=el('div','results');c.appendChild(results);fillResults(results,v,target);app.appendChild(c);setTimeout(()=>{if(S.search)inp.focus()},0)}
function fillResults(box,v,target){box.innerHTML='';const q=normalize(S.search);const used=new Set(v.used||[]);let list=PLAYERS.filter(p=>p.id!==target.id&&!used.has(p.id)&&(q?normalize(p.name).includes(q):true));list.sort((a,b)=>(b.recognition_score||0)-(a.recognition_score||0));list=list.slice(0,16);if(!list.length){box.appendChild(el('div','statusBox','Oyuncu bulunamadı.'));return}list.forEach(p=>{const b=el('button','playerBtn');b.innerHTML='<span><b>'+esc(p.name)+'</b><small>'+esc([p.club,p.country].filter(Boolean).join(' · '))+'</small></span><span class="arrow">›</span>';b.onclick=()=>submitSelection(p.id);box.appendChild(b)})}
function renderReveal(v,target,m){const rr=v.roundResult;if(!rr)return;const t=el('div','revealTitle','İKİ SEÇİM DE AÇILDI');app.appendChild(t);let text;if(rr.winner==='draw')text='BERABERE';else text=(rr.winner==='host'?v.players.host:v.players.guest)+' BU TURU KAZANDI';app.appendChild(el('div','winnerText'+(rr.winner==='draw'?' draw':''),esc(text)));app.appendChild(el('div','statusBox','Bir sonraki parametre birkaç saniye içinde otomatik açılacak.'))}
function renderFinal(v){brand('9 parametre tamamlandı');const c=el('div','card');const hs=v.scores.host,gs=v.scores.guest;let title=hs===gs?'OYUN BERABERE':hs>gs?v.players.host+' KAZANDI':v.players.guest+' KAZANDI';c.appendChild(el('div','label center','FİNAL'));c.appendChild(el('div','finalTitle',esc(title.toUpperCase())));c.appendChild(el('div','finalScore',hs+' — '+gs));const target=BY_ID.get(v.targetId);c.appendChild(el('div','center hint','Hedef futbolcu: <b>'+esc(target.name)+'</b>'));const stats=el('div','targetSummary');METRICS.forEach(m=>{const s=el('div','stat');s.innerHTML='<b>'+esc(m.label)+'</b><span>'+esc(formatValue(target[m.key],m.key))+'</span>';stats.appendChild(s)});c.appendChild(stats);app.appendChild(c);if(S.role==='host'){const b=button('AYNI ODAYLA YENİ OYUN',true,()=>startNewGame(hostGame.players.guest));app.appendChild(b)}else app.appendChild(el('div','statusBox','Oda sahibinin yeni oyunu başlatması bekleniyor.'));const leave=button('YAN OYUNLARA DÖN',false,()=>{cleanupPeer();location.href='../index.html'});app.appendChild(leave)}
async function init(){render();try{const res=await fetch('./data/players.json',{cache:'no-store'});if(!res.ok)throw new Error('data');const raw=await res.json();PLAYERS=raw.filter(p=>p&&p.playable!==false&&METRICS.every(m=>p[m.key]!==null&&p[m.key]!==undefined&&p[m.key]!==''));BY_ID=new Map(PLAYERS.map(p=>[Number(p.id),p]));S.screen='menu';render()}catch(e){clear();top();brand('Oyuncu havuzu yüklenemedi');const c=el('div','card center');c.innerHTML='<div class="error">Veri dosyası açılamadı. Sayfayı yenileyip tekrar dene.</div>';app.appendChild(c)}}
window.addEventListener('beforeunload',cleanupPeer);init();
</script>
</body>
