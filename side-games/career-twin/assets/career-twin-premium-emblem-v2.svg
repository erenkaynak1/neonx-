<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" role="img" aria-labelledby="title desc">
<title id="title">Kariyer İkizi amblemi</title>
<desc id="desc">Birbirine ayna tutan iki futbolcunun yeşil ve camgöbeği neon ile çevrili premium simetrik amblemi.</desc>
