<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON XI — Futbol Imposter</title>
<style>
html,body{margin:0;min-height:100%;background:#04070a;color:#bfffd8;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.load{font-size:13px;letter-spacing:.12em;opacity:.8}
</style>
</head>
<body>
<div class="load">FUTBOL IMPOSTER YÜKLENİYOR…</div>
<script>
(async()=>{
  try{
    const names=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt'];
    const parts=await Promise.all(names.map(n=>fetch('./parts/'+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text();})));
    let html=parts.join('');
    html=html.replace('</body>','<scr'+'ipt src="./arcade-realtime.js?v=20260831-realtime-1"></scr'+'ipt><scr'+'ipt src="./online-v2.js?v=20260903-social-leaderboard-v1"></scr'+'ipt><scr'+'ipt src="./paper-ui-fix.js?v=20260823-1"></scr'+'ipt><scr'+'ipt src="./online-v3-fix.js?v=20260823-3"></scr'+'ipt><scr'+'ipt src="./online-base44-imposter.js?v=20260903-social-leaderboard-v1"></scr'+'ipt><scr'+'ipt src="./paper-pc-v2.js?v=20260823-2"></scr'+'ipt><scr'+'ipt type="module" src="../social/neon-social.js?v=20260903-social-leaderboard-v1"></scr'+'ipt></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.body.innerHTML='<div style="padding:24px;text-align:center">Futbol Imposter yüklenemedi.<br><a href="./index.html" style="color:#49f6b1">Yan Oyunlara dön</a></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
