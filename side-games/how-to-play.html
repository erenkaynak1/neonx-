<script>
const guides={
 draft:{title:'DRAFT XI',sub:'En yüksek reytingli 11’i değil, birlikte en iyi çalışan 11’i kur.',play:'../index.html',html:`
  <section class="section"><h3>OYUNUN AMACI</h3><p>Draft boyunca formasyonundaki 11 pozisyonu oyuncularla doldurursun. Maça girmeden önce takımının kimyasını, oyuncu rollerini ve taktik planını kurarsın. Maç sonucu yalnızca kartlardaki genel güce göre değil; kurduğun takımın efektif gücü ve maç motorundaki kararların birlikte değerlendirilmesiyle oluşur.</p></section>
  <section class="section"><h3>DRAFT AKIŞI</h3><div class="steps"><div class="step"><div class="stepNo">1</div><div><b>FORMASYONUNU SEÇ</b><span>11 oyuncunun hangi pozisyonlara yerleşeceğini ve takımının temel saha yapısını belirler.</span></div></div><div class="step"><div class="stepNo">2</div><div><b>OYUNCULARINI DRAFT ET</b><span>Her seçimde sadece genel güce değil; pozisyona, oyuncunun özelliklerine ve kurduğun bağlantılara bak.</span></div></div><div class="step"><div class="stepNo">3</div><div><b>KİMYAYI YÜKSELT</b><span>Oyuncular arasındaki kulüp, milliyet, lig ve geçmiş bağlantıları oyuncu bazındaki efektif gücü artırır.</span></div></div><div class="step"><div class="stepNo">4</div><div><b>ROLLER + TAKTİK</b><span>Oyuncuların görevlerini ve takımın hücum/savunma yaklaşımını belirle. Bu seçimler maç motorunun hangi aksiyonlara ne kadar yöneleceğini etkiler.</span></div></div><div class="step"><div class="stepNo">5</div><div><b>2D MAÇI İZLE</b><span>Pas, koşu, şut, orta, top hareketi, kart, penaltı ve goller maç motorunun ürettiği olaylarla senkron ilerler.</span></div></div></div></section>
  <section class="section tech"><div class="techTitle"><h3>KİMYA — TEKNİK SİSTEM</h3><span class="max">MAKS. 10</span></div><p>Kimya takım için tek bir süs puanı değildir; her oyuncu için ayrı hesaplanır. Bir oyuncunun kimyası en fazla <b>10</b> olabilir.</p><div class="chemGrid"><div class="chemItem"><strong>Aynı milliyet <em>+3</em></strong><small>İki oyuncunun milliyeti aynıysa bağlantı üretir.</small></div><div class="chemItem"><strong>Aynı güncel kulüp <em>+3</em></strong><small>Şu anda aynı kulüpte oynayan futbolcular.</small></div><div class="chemItem"><strong>Aynı lig <em>+2</em></strong><small>Güncel kulüpleri aynı ligde bulunan futbolcular.</small></div><div class="chemItem"><strong>Ortak / eski bağ <em>+2</em></strong><small>Ortak eski kulüp veya geçmiş takım arkadaşlığı bağlantısı.</small></div></div><p class="note">Sistem oyuncunun yakınındaki dört olası bağlantıyı inceler ve bunların içinden kimya değeri en yüksek üç yerel bağlantıyı hesaba katar. Toplam sonuç 10’da sınırlandırılır.</p><div class="formula"><b>KİMYA / 10 × %25</b><span>Kimyanın oyuncu özelliklerine verdiği maksimum katkı %25’tir.</span><div class="scale"><div><b>2/10</b><small>+%5</small></div><div><b>4/10</b><small>+%10</small></div><div><b>6/10</b><small>+%15</small></div><div><b>8/10</b><small>+%20</small></div><div><b>10/10</b><small>+%25</small></div></div></div><p class="note"><b>Örnek:</b> 80 gücündeki bir özellik, oyuncu 10/10 kimyadaysa kimya etkisi açısından 100 seviyesine kadar çıkabilir. 8/10 kimyada aynı özellik +%20 etkilenir.</p></section>
  <section class="section"><h3>KİMYA İÇİN PRATİK OKUMA</h3><p>Aynı kulüp ve aynı milliyet güçlü bağlardır; ancak tek bir oyuncunun etrafına rastgele yıldızlar yığmak otomatik olarak maksimum kimya vermez. Formasyondaki konum ve kullanılacak en iyi yerel bağlantılar önemlidir. Bu yüzden draft sırasında yeni bir oyuncuyu seçmeden önce yalnızca kart gücünü değil, çevresindeki oyuncularla oluşturacağı bağlantıları da düşün.</p></section>
  <section class="section"><h3>TAKTİKLER NE YAPAR?</h3><div class="miniGrid"><div class="mini"><b>Genel Plan</b><span>Savunma ağırlıklı, dengeli veya hücum ağırlıklı takım davranışını belirler.</span></div><div class="mini"><b>Hücum Yönü</b><span>Takımın kanatları, merkezi veya iki bölgeyi dengeli kullanma eğilimini değiştirir.</span></div><div class="mini"><b>Son Aksiyon</b><span>Şut, orta veya ceza sahasına pasla girme gibi final tercihlerini ağırlıklandırır.</span></div><div class="mini"><b>Oyuncu Rolleri</b><span>Aynı futbolcunun saha içindeki davranışını ve takım içindeki görevini değiştirir.</span></div></div><p class="note">Taktik butonları görsel tercih değildir; maç motorunun aksiyon seçimlerine bağlanır. Rakibin yapısına ters gelen doğru plan, kağıt üzerinde daha güçlü bir takıma karşı fark yaratabilir.</p></section>
  <section class="section"><h3>MAÇ EKRANI</h3><p>2D saha, spiker, skor ve istatistikler aynı maç olaylarını takip eder. Sahada gördüğün şut veya gol, bağımsız bir dekoratif animasyon değil maç motorunun ürettiği olayın görsel karşılığıdır. Aynı kadro ve aynı taktikle bile maç içindeki olasılıklar nedeniyle her karşılaşmanın birebir aynı sonuçlanması beklenmez.</p></section>`},
 xox:{title:'FUTBOL XOX',sub:'İki koşulu aynı anda sağlayan futbolcuyu bul ve üçlü çizgiyi tamamla.',play:'./football-xox/index.html',html:`
  <section class="section"><h3>TEMEL KURAL</h3><p>3×3 tahtanın her satırında ve sütununda bir futbol koşulu bulunur. Hücreye dokunduğunda hem satırdaki hem sütundaki koşulu aynı anda sağlayan bir futbolcu seçmelisin.</p></section>
  <section class="section"><div class="steps"><div class="step"><div class="stepNo">1</div><div><b>HÜCREYİ SEÇ</b><span>Örneğin satır “Arjantin”, sütun “Barcelona” ise iki koşulu da sağlayan bir futbolcu gerekir.</span></div></div><div class="step"><div class="stepNo">2</div><div><b>FUTBOLCUYU BUL</b><span>Geçerli cevap hücreyi senin X veya O işaretinle kapatır.</span></div></div><div class="step"><div class="stepNo">3</div><div><b>AYNI İSMİ TEKRARLAMA</b><span>Aynı futbolcu aynı tahta üzerinde yalnızca bir kez kullanılabilir.</span></div></div><div class="step"><div class="stepNo">4</div><div><b>ÜÇLÜYÜ TAMAMLA</b><span>Yatay, dikey veya çapraz üç hücreyi alan ilk oyuncu kazanır.</span></div></div></div></section>
  <section class="section"><h3>KOŞUL TÜRLERİ</h3><p>Tahta; <b>kulüp, lig ve milliyet</b> koşullarından kombinasyonlar üretir. Oyuncu veritabanındaki kulüp geçmişi de uygun hücreleri çözmek için kullanılabilir.</p></section>`},
 twin:{title:'KARİYER İKİZİ',sub:'Hedef futbolcuya her turda en yakın kariyer profilini seç.',play:'./career-twin/index.html',html:`
  <section class="section"><h3>OYUNUN MANTIĞI</h3><p>Aynı hedef futbolcu oyun boyunca ortada kalır. Toplam <b>9 turda</b> her seferinde farklı bir kariyer parametresi açılır. İki oyuncu da havuzdan hedef futbolcuya o parametrede mümkün olduğunca yakın bir futbolcu seçer.</p></section>
  <section class="section"><h3>KULLANILAN 9 VERİ</h3><div class="miniGrid"><div class="mini"><b>Boy</b><span>cm</span></div><div class="mini"><b>Kilo</b><span>kg</span></div><div class="mini"><b>Doğum Tarihi</b><span>Tarih yakınlığı</span></div><div class="mini"><b>Kulüp Sayısı</b><span>Kariyer boyunca</span></div><div class="mini"><b>Kupa Sayısı</b><span>Kariyer kupaları</span></div><div class="mini"><b>Kayıtlı Gol</b><span>Kariyer toplamı</span></div><div class="mini"><b>Kayıtlı Asist</b><span>Kariyer toplamı</span></div><div class="mini"><b>En Yüksek Piyasa Değeri</b><span>€</span></div><div class="mini"><b>Kayıtlı Maç</b><span>Kariyer toplamı</span></div></div></section>
  <section class="section"><h3>TEK TELEFON / ONLINE</h3><p>Tek telefonda ilk oyuncunun seçimi gizlenir ve cihaz ikinci oyuncuya verilir. Online modda oda kurabilir veya 4 haneli kodla katılabilirsin. Tur sonunda seçimler karşılaştırılır; hedef değere daha yakın seçim avantaj sağlar.</p></section>`},
 imposter:{title:'FUTBOL IMPOSTER',sub:'Futbolcuyu bilenlerin arasındaki tek bilgisizi yakala.',play:'./futbol-imposter.html',html:`
  <section class="section"><h3>OYUNUN MANTIĞI</h3><p>Bir kişi hariç herkese aynı ünlü futbolcunun adı gösterilir. Rastgele seçilen imposter ise futbolcuyu görmez; ekranında yalnızca <b>“IMPOSTERSIN”</b> bilgisi vardır.</p></section>
  <section class="section"><div class="steps"><div class="step"><div class="stepNo">1</div><div><b>ROLLERİ GİZLİCE GÖR</b><span>Tek telefonda cihaz sırayla el değiştirir. Her oyuncu kendi kartını açar ve başkasına göstermeden kapatır.</span></div></div><div class="step"><div class="stepNo">2</div><div><b>İPUCU VER</b><span>Futbolcuyu bilenler sırayla onu ele vermeyecek ama bilenlerin anlayacağı bir ipucu söyler.</span></div></div><div class="step"><div class="stepNo">3</div><div><b>IMPOSTER BLÖF YAPAR</b><span>Imposter söylenen ipuçlarından futbolcuyu anlamaya ve kimliğini belli etmemeye çalışır.</span></div></div><div class="step"><div class="stepNo">4</div><div><b>ŞÜPHELİYİ BUL</b><span>İpuçlarının ardından grubun amacı futbolcuyu bilmeyen kişiyi tespit etmektir.</span></div></div></div></section>
  <section class="section"><h3>OYUNCU SAYISI</h3><p>Tek telefon modunda oyun <b>3 ile 12 kişi</b> arasında kurulabilir. İsim girmek opsiyoneldir. Farklı cihazlarla online oyun seçeneği de bulunur.</p></section>`},
 wordle:{title:'FOOTBALL WORDLE',sub:'Gizli futbolcu adını altı denemede harflerden çöz.',play:'./football-wordle/index.html',html:`

const selector=document.getElementById('selectorView'),guide=document.getElementById('guideView'),content=document.getElementById('guideContent'),home=document.getElementById('guideHome');
function openSelector(){history.replaceState(null,'',location.pathname);selector.style.display='block';guide.classList.remove('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));window.scrollTo(0,0)}
function openGuide(key,push=true){const g=guides[key]||guides.draft;selector.style.display='none';guide.classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===key));content.innerHTML=`<section class="guideHero"><div class="kicker">NEON XI · OYUN KILAVUZU</div><h2>${g.title}</h2><p>${g.sub}</p></section>${g.html}<div class="ctaRow"><button class="cta" type="button" id="backGames">← OYUN SEÇ</button><a class="cta primary" href="${g.play}">OYUNU AÇ →</a></div>`;document.getElementById('backGames').onclick=openSelector;if(push)history.replaceState(null,'','#'+key);window.scrollTo(0,0)}
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>openGuide(b.dataset.game));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openGuide(b.dataset.tab));home.onclick=openSelector;
const initial=location.hash.replace('#','');if(guides[initial])openGuide(initial,false);
</script>
