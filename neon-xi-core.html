/* KADRO aÃ§Ä±lÄ±ÅŸ ekranÄ± */
.bootScreen {
  position: fixed;
  inset: 0;
  z-index: 200000;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 20%, rgba(55,255,155,.08), transparent 26%),
    radial-gradient(circle at 80% 80%, rgba(0,255,170,.06), transparent 24%),
    linear-gradient(180deg, #020705 0%, #06110c 45%, #030705 100%);
}

.bootScreen.hidden {
  display: none;
}

.bootGlow {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: .18;
  pointer-events: none;
}

.bootGlow1 {
  width: 340px;
  height: 340px;
  top: 8%;
  left: 10%;
  background: rgba(60,255,170,.40);
}

.bootGlow2 {
  width: 420px;
  height: 420px;
  right: 4%;
  bottom: 2%;
  background: rgba(0,255,120,.22);
}

.bootPanel {
  position: relative;
  z-index: 2;
  width: min(980px, 92vw);
  padding: 28px;
  border-radius: 28px;
  border: 1px solid rgba(88,255,160,.25);
  background:
    linear-gradient(180deg, rgba(6,14,10,.94), rgba(3,9,6,.94));
  box-shadow:
    0 0 0 1px rgba(88,255,160,.08) inset,
    0 0 24px rgba(44,255,151,.10),
    0 0 60px rgba(44,255,151,.08),
    0 30px 80px rgba(0,0,0,.55);
}

.bootBrand {
  text-align: center;
  margin-bottom: 24px;
}

.bootKicker {
  color: #6effb1;
  font-size: 11px;
  letter-spacing: .22em;
  font-weight: 900;
  margin-bottom: 10px;
}

.bootBrand h1 {
  margin: 0;
  font-size: clamp(42px, 8vw, 78px);
  line-height: .95;
  letter-spacing: -.05em;
  color: #ecfff5;
  text-shadow:
    0 0 12px rgba(100,255,180,.20),
    0 0 28px rgba(100,255,180,.10);
}

.bootBrand p {
  margin: 10px 0 0;
  color: rgba(220,255,235,.75);
  font-size: 14px;
  letter-spacing: .08em;
}

.bootView {
  display: none;
}

.bootView.active {
  display: block;
}

.bootCards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 18px;
}

.bootCard {
  position: relative;
  min-height: 170px;
  padding: 22px;
  border-radius: 22px;
  border: 1px solid rgba(90,255,160,.28);
  background:
    linear-gradient(180deg, rgba(10,20,14,.92), rgba(7,15,11,.92));
  text-align: left;
  cursor: pointer;
  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease,
    background .18s ease;
  box-shadow:
    inset 0 0 0 1px rgba(90,255,160,.05),
    0 0 24px rgba(50,255,140,.07);
}

.bootCard:hover {
  transform: translateY(-3px);
  border-color: rgba(110,255,180,.55);
  box-shadow:
    inset 0 0 0 1px rgba(110,255,180,.12),
    0 0 20px rgba(60,255,150,.18),
    0 0 50px rgba(60,255,150,.10);
}

.bootCardTag {
  display: inline-flex;
  margin-bottom: 18px;
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid rgba(100,255,170,.25);
  color: #72ffba;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .16em;
}

.bootCard strong {
  display: block;
  color: #f3fff8;
  font-size: 28px;
  line-height: 1.05;
  margin-bottom: 10px;
}

.bootCard small {
  display: block;
  color: rgba(220,255,235,.72);
  font-size: 13px;
  line-height: 1.45;
}

.bootFormGrid {
  display: grid;
  gap: 16px;
}

.bootFormBox {
  display: grid;
  gap: 8px;
}

.bootFormBox label {
  color: #77ffbf;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .14em;
  text-transform: uppercase;
}

.bootFormBox input {
  height: 52px;
  padding: 0 16px;
  border-radius: 14px;
  border: 1px solid rgba(98,255,166,.24);
  outline: none;
  color: #f4fff8;
  background: rgba(7,16,12,.95);
  box-shadow:
    inset 0 0 0 1px rgba(98,255,166,.05),
    0 0 15px rgba(40,255,130,.04);
}

.bootFormBox input:focus {
  border-color: rgba(110,255,180,.55);
  box-shadow:
    0 0 0 1px rgba(110,255,180,.15),
    0 0 24px rgba(50,255,140,.12);
}

.bootActionRow {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.bootPrimaryBtn,
.bootGhostBtn {
  min-height: 50px;
  padding: 0 18px;
  border-radius: 14px;
  font-weight: 900;
  letter-spacing: .08em;
  cursor: pointer;
  transition: .18s ease;
}

.bootPrimaryBtn {
  border: 1px solid rgba(108,255,176,.45);
  color: #04110b;
  background: linear-gradient(180deg, #7fffc3, #34d97d);
  box-shadow:
    0 0 18px rgba(60,255,150,.18),
    0 0 42px rgba(60,255,150,.10);
}

.bootPrimaryBtn:hover {
  transform: translateY(-2px);
  box-shadow:
    0 0 24px rgba(60,255,150,.28),
    0 0 52px rgba(60,255,150,.14);
}

.bootGhostBtn {
  border: 1px solid rgba(98,255,166,.22);
  color: #dfffee;
  background: rgba(8,16,12,.82);
}

.bootGhostBtn:hover {
  border-color: rgba(110,255,180,.45);
  box-shadow: 0 0 20px rgba(60,255,150,.10);
}

.bootDivider {
  display: flex;
  align-items: center;
  gap: 14px;
  color: rgba(220,255,235,.55);
  font-size: 12px;
}

.bootDivider::before,
.bootDivider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: rgba(98,255,166,.14);
}

.onlineBootStatus {
  min-height: 22px;
  color: rgba(221,255,236,.82);
  font-size: 13px;
}

.lobbyWrap {
  display: grid;
  gap: 18px;
}

.lobbyCodeBox {
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 18px;
  border-radius: 18px;
  border: 1px solid rgba(99,255,170,.22);
  background: rgba(8,16,12,.7);
}

.lobbyCodeBox span {
  color: #76ffbe;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .18em;
}

.lobbyCodeBox strong {
  color: #f4fff8;
  font-size: 34px;
  letter-spacing: .12em;
}

.lobbyTeams {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 14px;
}

.lobbyTeamCard {
  padding: 18px;
  border-radius: 18px;
  border: 1px solid rgba(99,255,170,.22);
  background: rgba(8,16,12,.72);
}

.lobbyTeamCard span {
  display: block;
  color: #71ffbb;
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .15em;
  margin-bottom: 8px;
}

.lobbyTeamCard strong {
  color: #f1fff8;
  font-size: 20px;
  line-height: 1.2;
}

@media (max-width: 760px) {
  .bootCards,
  .lobbyTeams {
    grid-template-columns: 1fr;
  }

  .bootPanel {
    padding: 18px;
  }

  .bootCard strong {
    font-size: 22px;
  }
}

.neonImageShell {
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
.neonMenuBackdrop {
  display: none;
  position: absolute;
  z-index: 0;
  inset: -6%;
  width: 112%;
  height: 112%;
  object-fit: cover;
  object-position: center;
  pointer-events: none;
  user-select: none;
  filter: blur(24px) brightness(.28) saturate(1.25);
  transform: scale(1.05);
  opacity: .9;
}
.neonImageStage {
  z-index: 1;
  flex: 0 0 auto;
  max-width: none;
  max-height: none;
  box-shadow: 0 0 70px rgba(79,255,74,.08);
}
.neonMenuHotspot {
  opacity: 1 !important;
  overflow: visible;
  border-radius: 14px;
  transform: translateZ(0);
  transition: transform .16s ease;
}
.neonMenuHotspot::before {
  content: "";
  position: absolute;
  inset: 1.5% .5%;
  border-radius: 14px;
  border: 2px solid rgba(188,255,92,0);
  background: rgba(121,255,55,0);
  box-shadow:
    inset 0 0 0 1px rgba(217,255,169,0),
    0 0 0 rgba(126,255,68,0),
    0 0 0 rgba(126,255,68,0);
  opacity: 0;
  transition:
    opacity .18s ease,
    border-color .18s ease,
    background .18s ease,
    box-shadow .18s ease,
    transform .18s ease;
  pointer-events: none;
}
.neonMenuHotspot::after {
  content: "";
  position: absolute;
  z-index: 2;
  top: 7%;
  bottom: 7%;
  left: 2%;
  width: 26%;
  border-radius: 12px;
  background: linear-gradient(100deg,
    transparent 0%,
    rgba(210,255,167,0) 22%,
    rgba(210,255,167,.20) 50%,
    rgba(210,255,167,0) 78%,
    transparent 100%);
  opacity: 0;
  transform: translateX(-145%) skewX(-12deg);
  pointer-events: none;
}
.neonMenuHotspotSingle::before {
  opacity: .13;
  border-color: rgba(184,255,89,.20);
  box-shadow: 0 0 18px rgba(120,255,58,.12);
  animation: neonXiIdlePulse 2.8s ease-in-out infinite;
}
.neonMenuHotspot:hover::before,
.neonMenuHotspot:focus-visible::before,
.neonMenuHotspot.is-activating::before {
  opacity: 1;
  border-color: rgba(217,255,153,.96);
  background: rgba(112,255,45,.055);
  box-shadow:
    inset 0 0 0 1px rgba(224,255,186,.24),
    0 0 17px rgba(130,255,64,.72),
    0 0 42px rgba(130,255,64,.35);
  transform: scale(1.012);
  animation: none;
}
.neonMenuHotspot:hover::after,
.neonMenuHotspot:focus-visible::after {
  opacity: 1;
  animation: neonXiButtonSweep 1.15s ease-out infinite;
}
.neonMenuHotspot:active::before,
.neonMenuHotspot.is-activating::before {
  transform: scale(.985);
  background: rgba(163,255,81,.12);
}
.neonMenuHotspot.is-activating::after {
  opacity: 1;
  animation: neonXiConfirmSweep .24s ease-out both;
}
@keyframes neonXiIdlePulse {
  0%, 100% { opacity: .10; box-shadow: 0 0 12px rgba(120,255,58,.08); }
  50% { opacity: .28; box-shadow: 0 0 24px rgba(120,255,58,.20); }
}
@keyframes neonXiButtonSweep {
  0% { transform: translateX(-150%) skewX(-12deg); opacity: 0; }
  18% { opacity: 1; }
  70%, 100% { transform: translateX(390%) skewX(-12deg); opacity: 0; }
}
@keyframes neonXiConfirmSweep {
  from { transform: translateX(-145%) skewX(-12deg); opacity: .2; }
  to { transform: translateX(390%) skewX(-12deg); opacity: 1; }
}
@media (orientation: portrait) {

  .neonMenuHotspotSingle::before,
  .neonMenuHotspot:hover::after,
  .neonMenuHotspot:focus-visible::after,
  .neonMenuHotspot.is-activating::after {
    animation: none !important;
  }
